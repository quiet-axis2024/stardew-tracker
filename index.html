<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#4a2f20" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="星露谷農場手帳" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>星露谷農場手帳</title>
  <style>
    html,body,#root{margin:0;min-height:100%;width:100%;max-width:100%;overflow-x:hidden;background:#5a3825}
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
    *{box-sizing:border-box}
    body{position:relative;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
    button,input,textarea,select{font:inherit;max-width:100%}
    @media (hover:none) and (pointer:coarse){input,textarea,select{font-size:16px!important}}
    #boot-status{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:17vh 24px 0;color:#f4ddb0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:900;text-align:center}
    #boot-status .boot-logo{width:min(704px,88vw);height:auto;image-rendering:pixelated;filter:drop-shadow(0 5px 3px rgba(0,0,0,.18))}
    #boot-status .boot-loading{margin-top:auto;margin-bottom:23vh;font-size:15px;letter-spacing:2px;font-weight:950}
  </style>
</head>
<body>
  <div id="root"><div id="boot-status"><img class="boot-logo" src="./assets/game/main-logo-zh.png" alt="星露谷物語"><div class="boot-loading">LOADING…</div></div></div>
  <script src="./assets/game/local-assets-v67.js?v=73"></script>
  <script src="./cloud.js?v=73"></script>
  <script src="./farmer-preview-v33.js?v=73"></script>
  <script src="./animal-preview-v33.js?v=73"></script>
  <script src="./social-data-v50.js?v=73"></script>
  <script src="./machine-data-v51.js?v=73"></script>
  <script src="./switch-names-v47.js?v=73"></script>
  <script src="./world-map-pins-v73.js?v=73"></script>
  <script src="./world-map-secret-v75.js?v=75"></script>
  <script>
    window.SDVLazyDataV67=(()=>{
      const groups={lookup:["./lookup-data-v46.js?v=73","./lookup-extra-v49.js?v=73"],wardrobe:["./wardrobe-data-v34.js?v=73"],world:["./world-data-v70.js?v=73"]};
      const scripts=new Map(),loads=new Map();
      const one=src=>{if(scripts.has(src))return scripts.get(src);const p=new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.async=true;s.onload=ok;s.onerror=()=>no(new Error(`無法載入 ${src}`));document.head.appendChild(s)});scripts.set(src,p);return p};
      const load=g=>{if(loads.has(g))return loads.get(g);const p=(groups[g]||[]).reduce((q,s)=>q.then(()=>one(s)),Promise.resolve());loads.set(g,p);return p};
      return {load};
    })();
    (async()=>{
      const root=document.getElementById('root');
      let failureShown=false;
      const esc=(value)=>String(value||'未知錯誤').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      const fail=(message)=>{
        if(failureShown)return;
        failureShown=true;
        root.innerHTML='<div id="boot-status">⚠️ 手帳執行失敗<small style="margin-top:8px;display:block;font-weight:600;max-width:560px;word-break:break-word">'+esc(message)+'</small><button onclick="location.reload()" style="margin-top:16px;padding:9px 14px;border:2px solid #e7bd67;border-radius:9px;background:#fff1c9;color:#4a2f20;font-weight:800">重新載入</button></div>';
      };
      const failIfBlank=(message)=>setTimeout(()=>{
        if(!root || !String(root.textContent||'').trim())fail(message);
      },0);
      window.addEventListener('error',event=>{
        if(event.message)failIfBlank(event.message);
      });
      window.addEventListener('unhandledrejection',event=>{
        const reason=event.reason;
        failIfBlank(reason?.message||reason||'未處理的執行錯誤');
      });
      try{ if(window.SDVCloud) await window.SDVCloud.init(); }
      catch(error){ console.warn('Cloud init failed, falling back to local mode:',error); }
      const script=document.createElement('script');
      script.src='./app.js?v=73';
      script.onload=()=>{
        window.__SDV_APP_LOADED__=true;
        setTimeout(()=>{
          if(!String(root.textContent||'').trim())fail('app.js 已載入，但 React 主畫面沒有成功建立');
        },1200);
      };
      script.onerror=()=>fail('app.js 無法載入');
      document.body.appendChild(script);
    })();
    if('serviceWorker' in navigator){
      window.addEventListener('load',async()=>{
        try{ const registration=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}); await registration.update(); }
        catch(error){console.warn('Service worker update failed:',error);}
      });
    }
  </script>
</body>
</html>
