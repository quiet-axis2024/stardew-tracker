<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#4a2f20" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="星露谷手帳" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>星露谷進度手帳</title>
  <style>
    html,body,#root{margin:0;min-height:100%;width:100%;max-width:100%;overflow-x:hidden;background:#5a3825}
    *{box-sizing:border-box}
    body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
    button,input,textarea,select{font:inherit;max-width:100%}
    #boot-status{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#f4ddb0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:800;text-align:center}
  </style>
</head>
<body>
  <div id="root"><div id="boot-status">🌱 載入星露谷手帳…</div></div>
  <script src="./cloud.js?v=27"></script>
  <script>
    (async()=>{
      const root=document.getElementById('root');
      let failureShown=false;
      const esc=(value)=>String(value||'未知錯誤').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      const fail=(message)=>{
        if(failureShown)return;
        failureShown=true;
        root.innerHTML='<div id="boot-status">⚠️ 手帳執行失敗<small style="margin-top:8px;display:block;font-weight:600;max-width:560px;word-break:break-word">'+esc(message)+'</small><button onclick="location.reload()" style="margin-top:16px;padding:9px 14px;border:2px solid #e7bd67;border-radius:9px;background:#fff1c9;color:#4a2f20;font-weight:800">重新載入</button></div>';
      };
      const failIfBlank=(message)=>setTimeout(()=>{
        if(!root || !String(root.textContent||'').trim())fail(message);
      },0);
      window.addEventListener('error',event=>{
        if(event.message)failIfBlank(event.message);
      });
      window.addEventListener('unhandledrejection',event=>{
        const reason=event.reason;
        failIfBlank(reason?.message||reason||'未處理的執行錯誤');
      });
      try{ if(window.SDVCloud) await window.SDVCloud.init(); }
      catch(error){ console.warn('Cloud init failed, falling back to local mode:',error); }
      const script=document.createElement('script');
      script.src='./app.js?v=27';
      script.onload=()=>{
        window.__SDV_APP_LOADED__=true;
        setTimeout(()=>{
          if(!String(root.textContent||'').trim())fail('app.js 已載入，但 React 主畫面沒有成功建立');
        },1200);
      };
      script.onerror=()=>fail('app.js 無法載入');
      document.body.appendChild(script);
    })();
    if('serviceWorker' in navigator){
      window.addEventListener('load',async()=>{
        try{ const registration=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}); await registration.update(); }
        catch(error){console.warn('Service worker update failed:',error);}
      });
    }
  </script>
</body>
</html>
