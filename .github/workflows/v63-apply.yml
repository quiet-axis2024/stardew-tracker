name: Apply v63 icon polish

on:
  push:
    branches: [v63-icon-polish]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v63-icon-polish
          fetch-depth: 0
      - name: Apply v63 UI icon refinements
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.jsx')
          s=p.read_text(encoding='utf-8')
          reps=[
            ('  { id: "overview", name: "總覽", icon: "🏡", file: "Stardrop" },','  { id: "overview", name: "總覽", icon: "🏡", file: "Warp Totem: Farm" },',1),
            ('  { id: "data", name: "資料", icon: "⭐", file: "Book Of Stars" },','  { id: "data", name: "資料", icon: "⭐", file: "Stardew Valley Almanac" },',1),
            ('<SectionTitle icon="game:Book Of Stars">資料</SectionTitle>','<SectionTitle icon="game:Stardew Valley Almanac">資料</SectionTitle>',1),
            ('<SkillTab id="milestones" label="里程碑" file="Stardrop Tea"/>','<SkillTab id="milestones" label="里程碑" file="Golden Tag"/>',1),
            ('<SkillTab id="special" label="特殊能力" file="Treasure Chest"/>','<SkillTab id="special" label="特殊能力" file="Galaxy Soul"/>',1),
            ('<SectionTitle icon="🏆">重要里程碑</SectionTitle>','<SectionTitle icon="game:Golden Tag">重要里程碑</SectionTitle>',1),
            ('<SectionTitle icon="🎒">特殊物品與能力</SectionTitle>','<SectionTitle icon="game:Galaxy Soul">特殊物品與能力</SectionTitle>',2),
            ('<GameIcon file="Special Items & Powers Tab" size={28}/>特殊物品','<GameIcon file="Galaxy Soul" size={28}/>特殊物品',1),
          ]
          for old,new,expected in reps:
              count=s.count(old)
              if count!=expected:
                  raise SystemExit(f'expected {expected} match(es), got {count}: {old[:90]}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '?v=62' not in s or '<!-- deploy-v62 -->' not in s:
              raise SystemExit('index v62 markers missing')
          s=s.replace('?v=62','?v=63').replace('<!-- deploy-v62 -->','<!-- deploy-v63 -->')
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          if "stardew-tracker-v62" not in s:
              raise SystemExit('sw v62 marker missing')
          p.write_text(s.replace('stardew-tracker-v62','stardew-tracker-v63'),encoding='utf-8')
          PY
      - name: Validate v63
        run: |
          set -euo pipefail
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8
          mkdir -p .verify
          cat > .verify/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React = React;
          window.ReactDOM = { createRoot };
          EOF
          cat app.jsx >> .verify/entry.jsx
          ./node_modules/.bin/esbuild .verify/entry.jsx --bundle --format=iife --target=safari15 --outfile=.verify/app.js
          node --check sw.js
          grep -q 'file: "Warp Totem: Farm"' app.jsx
          grep -q 'file: "Stardew Valley Almanac"' app.jsx
          grep -q 'label="里程碑" file="Golden Tag"' app.jsx
          grep -q 'label="特殊能力" file="Galaxy Soul"' app.jsx
          grep -q 'GameIcon file="Galaxy Soul" size={28}.*特殊物品' app.jsx
          grep -q 'isPhoto43V62' app.jsx
          grep -q 'SimpleItemInfoV62' app.jsx
          grep -q 'navStackV62' app.jsx
          grep -q '?v=63' index.html
          grep -q 'stardew-tracker-v63' sw.js
          ! grep -q '第 3 層' app.jsx
          ! grep -q '第 4 層' app.jsx
      - name: Commit v63
        run: |
          set -euo pipefail
          rm -rf .verify node_modules package-lock.json package.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx index.html sw.js
          git rm -f .github/workflows/v63-apply.yml
          git commit -m 'v63: refine navigation and data icons'
          git push origin HEAD:v63-icon-polish
