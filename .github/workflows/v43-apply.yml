name: Apply v43 multilingual item search

on:
  push:
    branches: [v43-multilingual-item-search]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v43-multilingual-item-search
          fetch-depth: 0
      - name: Apply v43 patch
        run: |
          set -euo pipefail
          python3 v43_patch.py
      - name: Validate v43
        run: |
          set -euo pipefail
          node --check farmer-preview-v33.js
          node --check animal-preview-v33.js
          node --check wardrobe-data-v34.js
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8
          mkdir -p .verify
          cat > .verify/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React = React;
          window.ReactDOM = { createRoot };
          EOF
          cat app.jsx >> .verify/entry.jsx
          ./node_modules/.bin/esbuild .verify/entry.jsx --bundle --format=iife --target=safari15 --outfile=.verify/app.js
          grep -q 'ITEM_SEARCH_EXTRA_ALIASES_V43' app.jsx
          grep -q 'normalizeItemSearchV43' app.jsx
          grep -q '黃寶石' app.jsx
          grep -q '黄宝石' app.jsx
          grep -q 'Topaz' app.jsx
          grep -q '繁中／簡中／English' app.jsx
          grep -q 'app.js?v=43' index.html
          grep -q 'stardew-tracker-v43' sw.js
          python3 - <<'PY'
          from pathlib import Path
          a=Path('app.jsx').read_text(encoding='utf-8')
          assert 'Object.entries(ITEM_FILE_ZH_V26||{}).forEach' in a
          assert 'normalizeItemSearchV43(alias).includes(q)' in a
          assert '"Topaz":["黃寶石","黄宝石"]' in a
          assert '可輸入繁中／簡中／English' in a
          print('v43 multilingual search checks ok')
          PY
      - name: Commit v43 code
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx index.html sw.js
          git rm -f v43_patch.py
          git commit -m 'v43: support multilingual item search'
          git push origin HEAD:v43-multilingual-item-search
