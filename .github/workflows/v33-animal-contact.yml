name: Inspect v33 animal frames

on:
  push:
    branches: [v33-real-game-sprites]

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v33-real-game-sprites
          fetch-depth: 0
      - name: Build animal contact sheet
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, io, urllib.request
          from PIL import Image, ImageDraw
          commit='6fcc1d4d20d14c5be6232d0f9eac1d423222fd84'
          root=f'https://raw.githubusercontent.com/shayderrr/stardew_decomp/{commit}/stardew/unpacked/Animals/'
          names=['horse','cat','dog']
          sheet=Image.new('RGBA',(4*128,3*150),(245,236,212,255))
          d=ImageDraw.Draw(sheet)
          for r,name in enumerate(names):
              raw=urllib.request.urlopen(root+name+'.png').read()
              img=Image.open(io.BytesIO(raw)).convert('RGBA')
              d.text((4,r*150+4),f'{name} {img.size}',fill=(50,30,20,255))
              for row in range(4):
                  crop=img.crop((0,row*32,32,row*32+32)).resize((112,112),Image.Resampling.NEAREST)
                  sheet.alpha_composite(crop,(row*128+8,r*150+24))
                  d.text((row*128+8,r*150+136),f'row {row}',fill=(50,30,20,255))
          buf=io.BytesIO(); sheet.save(buf,format='PNG',optimize=True)
          open('animal-contact-v33.b64','w').write(base64.b64encode(buf.getvalue()).decode())
          PY
      - name: Commit contact sheet text
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add animal-contact-v33.b64
          git commit -m 'Inspect real animal direction frames'
          git push origin HEAD:v33-real-game-sprites
