name: Apply v47 data overview collections

on:
  push:
    branches: [v47-data-overview-collections]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v47-data-overview-collections
          fetch-depth: 0
      - name: Build Switch zh-CN name map
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/leafvmaple/wiki/ea197cc181d4f9c48f9080fc91c3559b288ecf6c/src/data/stardew-valley/generated'
          mkdir -p /tmp/sdv47
          for f in fish machines crops shops bundles villagers; do curl -L --fail --silent --show-error "$base/$f.json" -o "/tmp/sdv47/$f.json"; done
          python3 - <<'PY'
          import json
          from pathlib import Path
          names={}
          def add(en,zh):
              if isinstance(en,str) and isinstance(zh,str) and en.strip() and zh.strip():
                  names.setdefault(en.strip(),zh.strip())
          pairs=[('name','nameZh'),('machineName','machineNameZh'),('npcName','npcNameZh'),('itemName','itemNameZh'),('outputName','outputNameZh')]
          def walk(x):
              if isinstance(x,dict):
                  for a,b in pairs:
                      add(x.get(a),x.get(b))
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          for p in Path('/tmp/sdv47').glob('*.json'):
              walk(json.loads(p.read_text(encoding='utf-8')))
          # Known Switch Simplified-Chinese terms that are useful in this hand journal.
          names.update({
            'Prismatic Shard':'五彩碎片','Dinosaur Egg':'恐龙蛋','Ancient Seed':'古代种子',
            'Rabbit’s Foot':'兔子的脚','Rabbit\'s Foot':'兔子的脚','Battery Pack':'电池组',
            'Hardwood':'硬木','Iridium Ore':'铱矿石','Iridium Bar':'铱锭','Diamond':'钻石',
            'Rainbow Shell':'彩虹贝壳','Tea Leaves':'茶叶','Ancient Fruit':'上古水果',
            'Cherry Bomb':'樱桃炸弹','Bomb':'炸弹','Mega Bomb':'超级炸弹'
          })
          Path('switch-names-v47.js').write_text('/* Switch zh-CN display-name map, built from localized game-data extracts. */\nwindow.SDVSwitchNamesV47='+json.dumps(names,ensure_ascii=False,separators=(',',':'))+';\n',encoding='utf-8')
          print('switch names',len(names))
          PY
      - name: Apply v47 patch
        run: |
          set -euo pipefail
          python3 v47_patch.py
      - name: Validate v47
        run: |
          set -euo pipefail
          node --check switch-names-v47.js
          node --check lookup-data-v46.js
          node --check farmer-preview-v33.js
          node --check animal-preview-v33.js
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8
          mkdir -p .verify
          cat > .verify/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React = React;
          window.ReactDOM = { createRoot };
          EOF
          cat app.jsx >> .verify/entry.jsx
          ./node_modules/.bin/esbuild .verify/entry.jsx --bundle --format=iife --target=safari15 --outfile=.verify/app.js
          grep -q 'label="角色"' app.jsx
          grep -q 'label="里程碑"' app.jsx
          grep -q 'label="等級"' app.jsx
          grep -q '綠雨提醒' app.jsx
          grep -q 'switchNameV47' app.jsx
          grep -q 'switch-names-v47.js?v=47' index.html
          grep -q 'stardew-tracker-v47' sw.js
          ! grep -q 'recommendActionV46' app.jsx
          ! grep -q '>建議</span>' app.jsx
          python3 - <<'PY'
          from pathlib import Path
          a=Path('app.jsx').read_text(encoding='utf-8')
          overview=a[a.index('const renderOverview'):a.index('const renderSkills')]
          assert '進度速覽' not in overview and '重要里程碑' not in overview
          profile=a[a.index('const renderProfileCard'):a.index('const renderMiniItemV26')]
          assert '技能' not in profile or 'skillTotal' in profile
          assert '社區' in profile and '礦井' in profile and '動物' in profile
          data=a[a.index('const renderData'):a.index('const renderPeople')]
          assert data.index('label="角色"') < data.index('label="農場"') < data.index('label="社區"') < data.index('label="收藏"')
          coll=a[a.index('const renderCollection'):a.index('const buildSummary')]
          assert '<SectionTitle icon="📖">收集品</SectionTitle>' not in coll
          lookup=a[a.index('const renderItemUsageV42'):a.index('const renderFishTodayV4')]
          assert '建議' not in lookup
          assert '來源／取得方式' in lookup
          sw=Path('switch-names-v47.js').read_text(encoding='utf-8')
          assert '"Albacore":"青花鱼"' in sw
          assert '"Cherry Bomb":"樱桃炸弹"' in sw
          print('v47 validations ok')
          PY
      - name: Commit v47 code
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx index.html sw.js switch-names-v47.js
          git rm -f v47_patch.py
          git commit -m 'v47: reorganize data overview and collections'
          git push origin HEAD:v47-data-overview-collections
