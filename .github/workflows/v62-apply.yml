name: Apply v62 photo navigation collection UX

on:
  push:
    branches: [v62-photo-nav-collection-ux]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v62-photo-nav-collection-ux
          fetch-depth: 0

      - name: Apply v62 patch
        run: python3 v62_patch.py

      - name: Validate v62
        run: |
          set -euo pipefail
          node --check sw.js
          node --check lookup-data-v46.js
          node --check lookup-extra-v49.js
          node --check social-data-v50.js
          node --check machine-data-v51.js
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8
          mkdir -p .verify
          cat > .verify/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React = React;
          window.ReactDOM = { createRoot };
          EOF
          cat app.jsx >> .verify/entry.jsx
          ./node_modules/.bin/esbuild .verify/entry.jsx --bundle --format=iife --target=safari15 --outfile=.verify/app.js
          python3 - <<'PY'
          from pathlib import Path
          a=Path('app.jsx').read_text(encoding='utf-8')
          assert 'isPhoto43V62' in a and 'img.width * 0.105' in a
          assert 'navStackV62' in a and '← 返回上一步' in a
          assert 'lookup-detail-v62' in a and 'npc-card-${n}' in a
          assert 'SimpleItemInfoV62' in a and 'selectedCookingV62' in a
          assert '第 3 层' not in a and '第 4 层' not in a
          assert 'file="Farm Computer"' in a and 'file="Hay"' in a
          assert '?v=62' in Path('index.html').read_text(encoding='utf-8')
          assert 'stardew-tracker-v62' in Path('sw.js').read_text(encoding='utf-8')
          print('v62 validations ok')
          PY

      - name: Commit v62 code
        run: |
          set -euo pipefail
          rm -rf .verify node_modules package-lock.json package.json || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx index.html sw.js README.md
          git commit -m 'v62: photo OCR, consistent data UI, reversible detail navigation'
          git push origin HEAD:v62-photo-nav-collection-ux
