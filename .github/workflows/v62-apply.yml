    return <div>
      <Card style={{marginTop:8,padding:9}}><div style={{display:"flex",justifyContent:"space-between",fontSize:11,fontWeight:900,color:C.muted,marginBottom:5}}><span>{prepMode?"料理备料图鉴":"料理收集"}</span><span>{progressValue}/{progressMax}</span></div><ProgressBar value={progressValue} max={progressMax}/></Card>
      {selectedCookingV62&&<SimpleItemInfoV62 name={selectedCookingV62.name} file={selectedCookingV62.file} info={selectedCookingV62.info||""}/>} 
      <div style={{display:"flex",gap:5,marginTop:7}}><Pill small active={prepMode} onClick={()=>{setCookingModeV3("prep");setSelectedCookingV62(null)}}>备料图鉴</Pill><Pill small active={!prepMode} onClick={()=>{setCookingModeV3("dishes");setSelectedCookingV62(null)}}>料理收集</Pill></div>
      {prepMode&&<Card style={{marginTop:7,padding:8,background:"#FFF4D8"}}><div style={{fontSize:9.5,fontWeight:950,color:C.darkBrown}}>全料理一次性备料</div><div style={{fontSize:8.5,color:C.muted,lineHeight:1.4,marginTop:2}}>点亮＝已按攻略准备最低需求量；这里只记准备进度，不当库存管理。</div></Card>}
      {prepMode && <>
        <label style={{display:"flex",alignItems:"center",gap:6,margin:"8px 2px 0",fontSize:11,fontWeight:900,color:C.brown}}><input type="checkbox" checked={prepMissingOnlyV3} onChange={e=>setPrepMissingOnlyV3(e.target.checked)}/>只看还没准备的材料</label>
        {COOKING_PREP_GROUPS_V3.map(g=>{const rows=g.items.filter(it=>!prepMissingOnlyV3||!prepSetV3.includes(it[0]));return rows.length?<Card key={g.id} style={{marginTop:8,padding:9,background:g.id==="g5"?"#FFF0D2":C.paper}}><div style={{fontSize:12.5,fontWeight:950,color:C.darkBrown}}>{g.name}</div><div style={{fontSize:9.5,color:C.muted,marginTop:2,lineHeight:1.35}}>{g.desc}</div><div style={{display:"grid",gridTemplateColumns:"repeat(5,minmax(0,1fr))",gap:5,marginTop:7}}>{rows.map(it=>{const [id,name,file,need]=it,on=prepSetV3.includes(id);return <button key={id} onClick={()=>setSelectedCookingV62({name,file,info:`全料理一次性备料最低需求 ×${need}`})} style={{position:"relative",border:`2px solid ${selectedCookingV62?.file===file?C.orange:on?C.green:C.line}`,background:on?"#E5F3CF":C.paper,borderRadius:9,minHeight:82,padding:"5px 2px",cursor:"pointer"}}><div style={{height:35,display:"flex",alignItems:"center",justifyContent:"center"}}><GameIcon file={file} size={34}/></div><div style={{fontSize:9,fontWeight:950,color:C.ink,lineHeight:1.1,marginTop:2}}>{name}</div><span style={{position:"absolute",left:3,top:2,fontSize:8.5,fontWeight:950,color:C.brown,background:"#FFF1C9",borderRadius:6,padding:"1px 3px"}}>×{need}</span><span onClick={e=>{e.stopPropagation();togglePrepV3(id)}} style={{position:"absolute",right:2,top:1,fontSize:12,color:on?C.green:"#C9B99A",fontWeight:950,padding:2}}>{on?"✓":"○"}</span></button>})}</div></Card>:null})}
      </>}
      {!prepMode&&<div style={{display:"grid",gridTemplateColumns:"repeat(5,minmax(0,1fr))",gap:5,marginTop:8}}>{COOKING_DISHES_V3.map(it=>{const [id,name,file]=it,on=cookedSetV3.includes(id);return <button key={id} onClick={()=>setSelectedCookingV62({name,file,info:"料理图鉴；右上角圆点记录是否已经制作过。"})} style={{position:"relative",border:`2px solid ${selectedCookingV62?.file===file?C.orange:on?C.green:C.line}`,background:on?"#E5F3CF":C.paper,borderRadius:8,minHeight:75,padding:"5px 2px",cursor:"pointer"}}><GameIcon file={file} size={34}/><div style={{fontSize:8.8,fontWeight:900,color:C.ink,lineHeight:1.1,marginTop:2}}>{switchNameV47(name,file)}</div><span onClick={e=>{e.stopPropagation();toggleCookedV3(id)}} style={{position:"absolute",right:2,top:1,fontSize:11,color:on?C.green:"#C9B99A",fontWeight:950,padding:2}}>{on?"✓":"○"}</span></button>})}</div>}
    </div>;
  };
'''
          section('  const renderCookingV3 = () => {','\n\n  const renderPaperCollectionV3',cooking_new,'cooking collection')

          # Clear cooking info when switching collection categories.
          rep('    const tabClick = k => { setCollectionSection(k); if(["fish","artifact","mineral"].includes(k)){setSelectedCollection(k);setSelectedItem(null);} };',
              '    const tabClick = k => { setCollectionSection(k); setSelectedCookingV62(null); if(["fish","artifact","mineral"].includes(k)){setSelectedCollection(k);setSelectedItem(null);} };',
              'collection tab reset')

          # Unify data hierarchy buttons with the same transparent icon language as the bottom nav.
          rep('    const SkillTab=({id,label,file})=>{const active=skillSection===id;return <button onClick={()=>setSkillSection(id)} style={{border:`1.5px solid ${active?C.orange:C.line}`,background:active?"#FFE2A8":C.paper,borderRadius:8,padding:"3px 2px",display:"flex",flexDirection:"column",alignItems:"center",gap:2,cursor:"pointer",minWidth:0}}><GameIcon file={file} size={25}/><span style={{fontSize:8.4,fontWeight:950,color:active?C.darkBrown:C.muted}}>{label}</span></button>};',
              '    const SkillTab=({id,label,file})=>{const active=skillSection===id;return <button onClick={()=>setSkillSection(id)} style={{border:`1.5px solid ${active?C.orange:C.line}`,background:active?"#FFE2A8":C.paper,borderRadius:9,padding:"4px 2px",display:"flex",flexDirection:"column",alignItems:"center",gap:2,cursor:"pointer",minWidth:0}}><GameIcon file={file} size={27}/><span style={{fontSize:8.4,fontWeight:950,color:active?C.darkBrown:C.muted}}>{label}</span></button>};',
