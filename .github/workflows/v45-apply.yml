name: Apply v45 item source card

on:
  push:
    branches: [v45-item-card-source]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v45-item-card-source
          fetch-depth: 0
      - name: Apply v45 patch
        run: |
          set -euo pipefail
          python3 v45_patch.py
      - name: Validate v45
        run: |
          set -euo pipefail
          node --check farmer-preview-v33.js
          node --check animal-preview-v33.js
          node --check wardrobe-data-v34.js
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8
          mkdir -p .verify
          cat > .verify/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React = React;
          window.ReactDOM = { createRoot };
          EOF
          cat app.jsx >> .verify/entry.jsx
          ./node_modules/.bin/esbuild .verify/entry.jsx --bundle --format=iife --target=safari15 --outfile=.verify/app.js
          grep -q 'sources:new Set()' app.jsx
          grep -q '>來源</span>' app.jsx
          grep -q 'recommendActionV45' app.jsx
          grep -q '賣出 1 個即可點亮' app.jsx
          grep -q 'app.js?v=45' index.html
          grep -q 'stardew-tracker-v45' sw.js
          ! grep -q 'sellPriceTextV44' app.jsx
          ! grep -q 'recommendReasonV44' app.jsx
          ! grep -q 'item-prices-v44.js' index.html
          python3 - <<'PY'
          from pathlib import Path
          a=Path('app.jsx').read_text(encoding='utf-8')
          section=a[a.index('const renderItemUsageV42'):a.index('const renderFishTodayV4')]
          assert 'selected.shippable&&!shipped' not in section
          assert 'mustKeepV45=Boolean(selected&&(usageSpecial?.keep||museum||fixedUses))' in section
          assert '來源</span>' in section
          assert '建議</span>' in section
          assert 'sellPrice' not in section
          assert 'recommendReason' not in section
          assert 'FISH_INFO[i]' in section
          assert 'ARTIFACT_INFO[i]' in section
          assert 'MINERAL_INFO[i]' in section
          print('v45 item source/recommendation checks ok')
          PY
      - name: Commit v45 code
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx index.html sw.js
          git rm -f item-prices-v44.js v45_patch.py
          git commit -m 'v45: show item source and simplify keep/sell advice'
          git push origin HEAD:v45-item-card-source
