name: Apply v31 wardrobe correction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v31 correction
        run: |
          set -euo pipefail
          python3 runtime_repair.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8').replace('cloud.js?v=30','cloud.js?v=31').replace('app.js?v=30','app.js?v=31').replace('<!-- deploy-v30b -->','<!-- deploy-v31 -->')
          p.write_text(s,encoding='utf-8')
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8').replace("stardew-tracker-v30","stardew-tracker-v31")
          p.write_text(s,encoding='utf-8')
          PY

      - name: Compile and smoke wardrobe
        run: |
          set -euo pipefail
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8 jsdom@26
          mkdir -p .verify
          cat > .verify/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React = React;
          window.ReactDOM = { createRoot };
          EOF
          cat app.jsx >> .verify/entry.jsx
          ./node_modules/.bin/esbuild .verify/entry.jsx --bundle --format=iife --target=safari15 --outfile=.verify/app.js
          cat > .verify/smoke.mjs <<'EOF'
          import fs from 'node:fs';
          import {JSDOM,VirtualConsole} from 'jsdom';
          const errors=[]; const vc=new VirtualConsole();
          vc.on('jsdomError',e=>errors.push(String(e?.stack||e)));
          const dom=new JSDOM('<!doctype html><html><body><div id="root">boot</div></body></html>',{runScripts:'dangerously',url:'https://quiet-axis2024.github.io/stardew-tracker/',virtualConsole:vc,pretendToBeVisual:true});
          dom.window.alert=()=>{};dom.window.confirm=()=>false;dom.window.prompt=()=>null;dom.window.scrollTo=()=>{};
          dom.window.addEventListener('error',e=>errors.push(String(e.message||e.error||e)));
          dom.window.eval(fs.readFileSync('.verify/app.js','utf8'));
          const wait=ms=>new Promise(r=>setTimeout(r,ms)); await wait(650);
          const root=dom.window.document.getElementById('root');
          const click=text=>{const b=[...root.querySelectorAll('button')].find(x=>x.textContent.trim()===text); if(!b) throw new Error('button not found: '+text); b.dispatchEvent(new dom.window.MouseEvent('click',{bubbles:true}));};
          click('衣櫥'); await wait(100);
          if(!root.textContent.includes('裝備槽位與取得方式')) throw new Error('new wardrobe board missing');
          click('馬'); await wait(80);
          if(!root.textContent.includes('帽子槽')) throw new Error('animal hat slot missing');
          if(errors.length){console.error(errors.join('\n---\n'));process.exit(1)}
          console.log('V31_SMOKE_OK');
          EOF
          node .verify/smoke.mjs
          grep -q 'display:"flex",flexWrap:"nowrap"' app.jsx
          if grep -q 'const selectedHat=' app.jsx; then echo 'fake overlay still present'; exit 1; fi
          grep -q 'app.js?v=31' index.html
          grep -q 'stardew-tracker-v31' sw.js

      - name: Commit canonical v31 and cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx index.html sw.js
          git rm runtime_repair.py sitecustomize.py .github/workflows/v31-apply.yml
          git commit -m 'Fix wardrobe slots and compact navigation'
          git push origin HEAD:main
