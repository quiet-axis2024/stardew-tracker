name: Fix v46 lookup source mapping

on:
  push:
    branches: [v46-lookup-complete]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v46-lookup-complete
          fetch-depth: 0
      - name: Fetch pinned Stardew data
        run: |
          set -euo pipefail
          mkdir -p /tmp/sdv-v46
          BASE='https://raw.githubusercontent.com/juliaramosguedes/stardew-data/4e0d98119afefd766f15ee77a529db4eb71fa240/data/en-US'
          for f in objects.json bigcraftables.json recipes.json shops.json boots.json weapons.json hats.json trinkets.json books.json; do curl -L --fail --silent --show-error "$BASE/$f" -o "/tmp/sdv-v46/$f"; done
      - name: Fix lookup data
        run: python3 v46_lookup_fix.py
      - name: Validate corrected lookup
        run: |
          set -euo pipefail
          node --check lookup-data-v46.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('lookup-data-v46.js').read_text(encoding='utf-8')
          data=json.loads(p.split('=',1)[1].rsplit(';',1)[0])['items']
          d={x['name']:x for x in data}
          assert d['Bomb']['zh']=='炸彈'
          assert any(x.startswith('製作：') for x in d['Bomb']['sources']),d['Bomb']
          assert not any(x.startswith('製作：') for x in d['Wild Horseradish']['sources']),d['Wild Horseradish']
          assert not any('探險家公會購買'==x for x in d['Weeds']['sources']),d['Weeds']
          print('corrected lookup ok',len(d))
          PY
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8
          mkdir -p .verify
          printf "import React from 'react';\nimport { createRoot } from 'react-dom/client';\nwindow.React=React;window.ReactDOM={createRoot};\n" > .verify/entry.jsx
          cat app.jsx >> .verify/entry.jsx
          ./node_modules/.bin/esbuild .verify/entry.jsx --bundle --format=iife --target=safari15 --outfile=.verify/app.js
      - name: Commit corrected lookup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lookup-data-v46.js
          git rm -f v46_lookup_fix.py .github/workflows/v46-fix.yml
          git commit -m 'v46: correct recipe and shop lookup mappings'
          git push origin HEAD:v46-lookup-complete
