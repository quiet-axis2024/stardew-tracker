name: Apply v57 profile OCR fix
on:
  push:
    branches: [v57-profile-ocr-fix]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v57-profile-ocr-fix
          fetch-depth: 0
      - name: Apply OCR patch
        run: python3 .github/scripts/v57_profile_ocr.py
      - name: Validate runtime and calibrated fields
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save eslint@8 react@18 react-dom@18 esbuild@0.25.8 >/dev/null 2>&1
          ./node_modules/.bin/eslint app.jsx --no-eslintrc --env browser,es2021 --parser-options '{"ecmaVersion":2022,"sourceType":"script","ecmaFeatures":{"jsx":true}}' --global React --global ReactDOM --rule 'no-undef:error'
          grep -q 'panelMoneyCrop = makeCrop(img, 0.610, 0.638, 0.130, 0.060, 5, 110)' app.jsx
          grep -q 'incomeCrop = makeCrop(img, 0.570, 0.695, 0.150, 0.060, 5, 110)' app.jsx
          grep -q 'seasonCrop = makeCrop(img, 0.575, 0.768, 0.040, 0.050, 6, 100)' app.jsx
          grep -q 'bestFarmNameResultV57' app.jsx
          grep -q 'recognize(seasonCrop, "春夏秋冬季")' app.jsx
          ! grep -q 'recognize(hudMoneyCrop' app.jsx
          grep -q 'app.js?v=57' index.html
          grep -q 'stardew-tracker-v57' sw.js
          mkdir -p build
          printf '%s\n' "import React from 'react';" "import { createRoot } from 'react-dom/client';" "window.React = React;" "window.ReactDOM = { createRoot };" > build/entry.jsx
          cat app.jsx >> build/entry.jsx
          ./node_modules/.bin/esbuild build/entry.jsx --bundle --minify --format=iife --target=safari15 --outfile=/tmp/v57-app.js
          test -s /tmp/v57-app.js
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx index.html sw.js
          git commit -m 'v57: recalibrate Switch profile screenshot OCR'
          git push origin HEAD:v57-profile-ocr-fix
