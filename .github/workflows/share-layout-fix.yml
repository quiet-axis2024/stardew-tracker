name: Fix Share Layout

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Align copy/share button order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.jsx')
          s=p.read_text(encoding='utf-8')
          old='''<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}><button onClick={shareTrackerView} style={{border:`2px solid ${C.green}`,background:C.lightGreen,color:C.green,borderRadius:9,padding:10,fontWeight:950}}>分享手帳…</button><button onClick={copyTrackerView} style={{border:`2px solid ${C.line}`,background:C.cream,color:C.brown,borderRadius:9,padding:10,fontWeight:950}}>複製連結</button></div>'''
          new='''<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}><button onClick={copyTrackerView} style={{border:`2px solid ${C.green}`,background:C.lightGreen,color:C.green,borderRadius:9,padding:10,fontWeight:950}}>複製連結</button><button onClick={shareTrackerView} style={{border:`2px solid ${C.orange}`,background:"#FFE4C5",color:C.brown,borderRadius:9,padding:10,fontWeight:950}}>分享手帳…</button></div>'''
          if old not in s:
              raise SystemExit('share button layout marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          i=Path('index.html')
          t=i.read_text(encoding='utf-8')
          t=t.replace('cloud.js?v=15','cloud.js?v=16').replace('app.js?v=15','app.js?v=16')
          i.write_text(t,encoding='utf-8')

          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8').replace("stardew-tracker-v15","stardew-tracker-v16")
          sw.write_text(t,encoding='utf-8')
          PY

      - name: Compile check
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8
          mkdir -p .check
          cat > .check/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React = React;
          window.ReactDOM = { createRoot };
          EOF
          cat app.jsx >> .check/entry.jsx
          ./node_modules/.bin/esbuild .check/entry.jsx --bundle --minify --format=iife --target=safari15 --outfile=/tmp/app.js

      - name: Commit canonical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx index.html sw.js
          git commit -m 'Align copy and share button positions'
          git push origin HEAD:main

      - name: Deploy Pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
