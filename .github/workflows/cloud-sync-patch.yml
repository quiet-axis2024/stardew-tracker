name: Apply Supabase cloud sync

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cloud-sync-patch.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Run patch script from previous revision
        shell: bash
        run: |
          git show HEAD^:.github/workflows/cloud-sync-patch.yml > /tmp/previous.yml
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/previous.yml').read_text().splitlines()
          out=[]; inside=False
          for line in text:
              if line.strip() == "python3 - <<'PY'":
                  inside=True
                  continue
              if inside and line.strip() == 'PY':
                  break
              if inside:
                  out.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/cloud_patch.py').write_text('\n'.join(out)+'\n')
          PY
          python3 /tmp/cloud_patch.py
          rm -f .github/workflows/cloud-sync-patch.yml
      - name: Commit cloud integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add secure Supabase cloud sync and read-only sharing"
          git push
