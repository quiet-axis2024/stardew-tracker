name: Apply v53 official Switch names
on:
  push:
    branches: [v53-switch-official-names]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v53-switch-official-names
          fetch-depth: 0

      - name: Build complete game zh-CN item-name map
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re, urllib.request

          PIN='45fd0615158f0c93f355b04ee33bf3f3d8afe303'
          ROOT=f'https://raw.githubusercontent.com/Andre-Favero/stardew-valley/{PIN}/jsons'
          FILES=[
              'objects.json','big-craftables.json','boots.json','hats.json',
              'tools.json','trinkets.json','weapons.json','shirts.json','pants.json'
          ]
          UA={'User-Agent':'stardew-tracker-build/1.0'}

          def fetch_json(name):
              req=urllib.request.Request(f'{ROOT}/{name}',headers=UA)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.load(r)

          official={}
          source_counts={}
          cjk=re.compile(r'[\u3400-\u9fff]')
          for fname in FILES:
              payload=fetch_json(fname)
              rows=payload.values() if isinstance(payload,dict) else payload
              count=0
              for row in rows:
                  if not isinstance(row,dict): continue
                  labels=row.get('names') or {}
                  en=str(labels.get('data-en-US') or '').strip()
                  zh=str(labels.get('data-zh-CN') or '').strip()
                  item_id=str(row.get('id') or '').strip()
                  # Some hidden map nodes intentionally remain English in zh-CN;
                  # don't let those replace an existing useful Chinese label.
                  if en and zh and cjk.search(zh):
                      official[en.lower()]=zh
                      # Named game IDs (Book_Horse, BigChest, BasiliskPaw...) are
                      # also used as lookup asset keys. Numeric IDs are category-
                      # scoped, so don't add them as global aliases.
                      if item_id and not item_id.isdigit():
                          official[item_id.lower()]=zh
                      count+=1
              source_counts[fname]=count

          # Exact official game/wiki display names for source-name variants used by
          # the social snapshot. These are aliases only; the displayed Chinese is
          # still the official zh-CN wording.
          official.update({
              'large goat milk':'大瓶羊奶',
              'jack be nimble jack be thick':'铜墙铁壁',
              'jack be nimble, jack be thick':'铜墙铁壁',
              'strange doll (green)':'诡异玩偶（绿）',
              'strange doll (yellow)':'诡异玩偶（黄）',
              'cookie':'饼干'
          })

          if len(official)<900:
              raise RuntimeError(f'official zh-CN map unexpectedly small: {len(official)}; {source_counts}')

          p=Path('switch-names-v47.js')
          old_text=p.read_text(encoding='utf-8')
          marker='window.SDVSwitchNamesV47='
          if marker not in old_text:
              raise RuntimeError('switch name map marker missing')
          old=json.loads(old_text.split(marker,1)[1].rsplit(';',1)[0])
          names=dict(old)
          for key in list(names):
              if isinstance(key,str) and key.lower() in official:
                  names[key]=official[key.lower()]
          for lower,zh in official.items():
              names[lower]=zh

          header=(
              '/* Stardew Valley zh-CN display-name map. Item/equipment names are '
              'generated from a pinned multilingual game-data export; legacy '
              'non-item aliases are retained. */\n'
          )
          p.write_text(header+'window.SDVSwitchNamesV47='+json.dumps(names,ensure_ascii=False,separators=(',',':'))+';\n',encoding='utf-8')
          print('localized official aliases',len(official),'total aliases',len(names),source_counts)

          app=Path('app.jsx'); s=app.read_text(encoding='utf-8')
          old_line='  const direct=map[String(file||"")]||map[String(name||"")];'
          new_line='  const fileKey=String(file||""),nameKey=String(name||"");\n  const direct=map[fileKey]||map[nameKey]||map[fileKey.toLowerCase()]||map[nameKey.toLowerCase()];'
          if old_line in s:
              s=s.replace(old_line,new_line,1)
          elif 'map[fileKey.toLowerCase()]' not in s:
              raise RuntimeError('switchNameV47 direct lookup marker missing')
          app.write_text(s,encoding='utf-8')

          ip=Path('index.html'); h=ip.read_text(encoding='utf-8')
          if '?v=52' in h:
              h=h.replace('?v=52','?v=53').replace('<!-- deploy-v52 -->','<!-- deploy-v53 -->')
          elif '?v=53' not in h:
              raise RuntimeError('asset query version marker missing')
          ip.write_text(h,encoding='utf-8')

          sw=Path('sw.js'); w=sw.read_text(encoding='utf-8')
          if 'stardew-tracker-v52' in w:
              w=w.replace('stardew-tracker-v52','stardew-tracker-v53',1)
          elif 'stardew-tracker-v53' not in w:
              raise RuntimeError('service-worker cache version marker missing')
          sw.write_text(w,encoding='utf-8')
          PY

      - name: Validate official names and coverage
        shell: bash
        run: |
          set -euo pipefail
          node --check switch-names-v47.js
          node --check sw.js
          node <<'NODE'
          global.window={};
          require('./switch-names-v47.js');
          require('./lookup-data-v46.js');
          require('./social-data-v50.js');
          const map=window.SDVSwitchNamesV47;
          const nameOf=(name,file='')=>map[file]||map[name]||map[String(file||'').toLowerCase()]||map[String(name||'').toLowerCase()]||name;
          const expected={
            'Ancient Sword':'古剑',
            'Basilisk Paw':'蜥怪的爪子',
            'Combat Quarterly':'战斗季刊',
            'Monster Compendium':'怪物图鉴',
            'Holly':'冬青树',
            'Large Goat Milk':'大瓶羊奶',
            'Jack Be Nimble Jack Be Thick':'铜墙铁壁',
            'Strange Doll (green)':'诡异玩偶（绿）',
            'Strange Doll (yellow)':'诡异玩偶（黄）',
            'Cookie':'饼干'
          };
          for(const [en,zh] of Object.entries(expected)){
            if(nameOf(en)!==zh) throw new Error(`${en}: expected ${zh}, got ${nameOf(en)}`);
          }

          const rows=window.SDVLookupV46.items||[];
          const englishRows=rows.filter(r=>/[A-Za-z]/.test(String(r.name||'')));
          const uncovered=[];
          for(const r of englishRows){
            const zh=nameOf(r.name,r.file);
            if(zh===r.name||!/[\u3400-\u9fff]/.test(zh)) uncovered.push(r.name);
          }
          const ratio=(englishRows.length-uncovered.length)/Math.max(1,englishRows.length);
          console.log(`lookup Chinese-name coverage ${englishRows.length-uncovered.length}/${englishRows.length} = ${(ratio*100).toFixed(1)}%`);
          console.log('sample lookup names without Chinese mapping',uncovered.slice(0,40));
          if(ratio<0.97) throw new Error('official-name coverage below 97%');

          const generic=/^(All |Any |Most |Every |Universal )|\(except|except |items$|category$/i;
          const missingSocial=[];
          for(const profile of Object.values(window.SDVSocialV50.byZh||{})){
            for(const raw of [...(profile.loves||[]),...(profile.likes||[]),...(profile.hates||[])]){
              if(generic.test(raw)||!/[A-Za-z]/.test(raw)) continue;
              const zh=nameOf(raw);
              if(zh===raw||!/[\u3400-\u9fff]/.test(zh)) missingSocial.push(raw);
            }
          }
          const uniq=[...new Set(missingSocial)];
          console.log('concrete social names still untranslated',uniq.length,uniq);
          if(uniq.length!==0) throw new Error('concrete social names still untranslated');
          NODE
          grep -q 'map\[fileKey.toLowerCase()\]' app.jsx
          grep -q '?v=53' index.html
          grep -q 'stardew-tracker-v53' sw.js

      - name: Build Safari bundle
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8 >/dev/null 2>&1
          mkdir -p build /tmp/v53dist
          cat > build/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React = React;
          window.ReactDOM = { createRoot };
          EOF
          cat app.jsx >> build/entry.jsx
          ./node_modules/.bin/esbuild build/entry.jsx --bundle --minify --format=iife --target=safari15 --outfile=/tmp/v53dist/app.js
          cp index.html manifest.webmanifest icon.svg sw.js cloud.js wardrobe-data-v34.js farmer-preview-v33.js animal-preview-v33.js lookup-data-v46.js lookup-extra-v49.js social-data-v50.js machine-data-v51.js switch-names-v47.js /tmp/v53dist/
          test -s /tmp/v53dist/app.js
          test -s /tmp/v53dist/switch-names-v47.js
          grep -q 'switch-names-v47.js?v=53' /tmp/v53dist/index.html

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx switch-names-v47.js index.html sw.js
          if git diff --cached --quiet; then
            echo 'No product changes to commit'
          else
            git commit -m 'v53: complete official Chinese item names'
            git push origin HEAD:v53-switch-official-names
          fi
