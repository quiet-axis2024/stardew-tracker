name: Apply v34 wardrobe builder

on:
  push:
    branches: [v34-wardrobe-builder]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v34-wardrobe-builder
          fetch-depth: 0
      - name: Apply v34 patch
        run: |
          set -euo pipefail
          python3 v34_patch.py
      - name: Validate generated wardrobe and app
        run: |
          set -euo pipefail
          node --check wardrobe-data-v34.js
          node --check farmer-preview-v33.js
          node --check animal-preview-v33.js
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8
          mkdir -p .verify
          cat > .verify/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React = React;
          window.ReactDOM = { createRoot };
          EOF
          cat app.jsx >> .verify/entry.jsx
          ./node_modules/.bin/esbuild .verify/entry.jsx --bundle --format=iife --target=safari15 --outfile=.verify/app.js
          grep -q 'v34：拿來自己配穿搭' app.jsx
          grep -q '染色 RGB' app.jsx
          grep -q '搜尋.*名稱或材料' app.jsx
          grep -q 'wardrobe-data-v34.js?v=34' index.html
          grep -q 'stardew-tracker-v34' sw.js
          python3 - <<'PY'
          import re,json
          s=open('wardrobe-data-v34.js',encoding='utf-8').read()
          m=re.search(r'const data=(\{.*\});\n  data.byKey=',s,re.S)
          d=json.loads(m.group(1))
          assert len(d['hats']) >= 90, len(d['hats'])
          assert len(d['shirts']) >= 200, len(d['shirts'])
          assert len(d['pants']) >= 15, len(d['pants'])
          assert any(x.get('recipe') for x in d['shirts'])
          assert any(x.get('dyeable') for x in d['shirts'])
          print('wardrobe counts',len(d['hats']),len(d['shirts']),len(d['pants']))
          PY
      - name: Commit v34 code
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx index.html sw.js farmer-preview-v33.js animal-preview-v33.js wardrobe-data-v34.js
          git rm -f v34_patch.py
          git commit -m 'v34: complete outfit builder data and RGB recipes'
          git push origin HEAD:v34-wardrobe-builder
