name: Flatten tracker app
on:
  push:
    branches: [main]
    paths: ['.github/workflows/flatten.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild single app.jsx
        shell: bash
        run: |
          set -e
          cat app0.txt app1.txt app2.txt app3.txt app4.txt | base64 -d | gunzip > app.jsx
          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="zh-Hant">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
            <meta name="theme-color" content="#4a2f20" />
            <meta name="apple-mobile-web-app-capable" content="yes" />
            <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
            <meta name="apple-mobile-web-app-title" content="星露谷手帳" />
            <link rel="manifest" href="./manifest.webmanifest" />
            <link rel="icon" href="./icon.svg" type="image/svg+xml" />
            <title>星露谷進度手帳</title>
            <style>
              html,body,#root{margin:0;min-height:100%;background:#5a3825}*{box-sizing:border-box}
              body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
              button,input,textarea,select{font:inherit}
            </style>
          </head>
          <body>
            <div id="root"></div>
            <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
            <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
            <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
            <script type="text/babel" data-presets="react" src="./app.jsx"></script>
            <script>
              if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
              }
            </script>
          </body>
          </html>
          EOF
          rm -f app0.txt app1.txt app2.txt app3.txt app4.txt loader.js
      - name: Commit flattened app
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Flatten tracker into single app.jsx"
          git push
