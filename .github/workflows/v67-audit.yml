name: Apply v67 foundation polish

on:
  push:
    branches: [v67-foundation-polish]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v67-foundation-polish
          fetch-depth: 0

      - name: Apply v67 foundation changes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-v67.py

      - name: Validate v67
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit-foundation-v67.py
          node --check sw.js
          node --check assets/game/local-assets-v67.js
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8 eslint@9
          mkdir -p build
          cat > build/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React = React;
          window.ReactDOM = { createRoot };
          EOF
          cat app.jsx >> build/entry.jsx
          ./node_modules/.bin/esbuild build/entry.jsx --bundle --minify --format=iife --target=safari15 --outfile=build/app.js 2>build/esbuild.stderr
          cat build/esbuild.stderr
          if grep -q '\[WARNING\]' build/esbuild.stderr; then echo 'Unexpected esbuild warning'; exit 1; fi
          cat > build/eslint.config.mjs <<'EOF'
          export default [{files:['entry-lint.jsx'],languageOptions:{parserOptions:{ecmaVersion:'latest',sourceType:'module',ecmaFeatures:{jsx:true}},globals:{window:'readonly',document:'readonly',navigator:'readonly',localStorage:'readonly',URL:'readonly',Image:'readonly',FileReader:'readonly',Blob:'readonly',confirm:'readonly',alert:'readonly',requestAnimationFrame:'readonly',setTimeout:'readonly',clearTimeout:'readonly',fetch:'readonly',React:'readonly',ReactDOM:'readonly'}},rules:{'no-undef':'error'}}];
          EOF
          cp build/entry.jsx build/entry-lint.jsx
          (cd build && ../node_modules/.bin/eslint --config eslint.config.mjs entry-lint.jsx --no-ignore)
          test -s assets/game/main-logo-zh.png
          test -s assets/game/local-assets-v67.js
          test -s DATA_PROVENANCE.md
          echo "Local game assets: $(find assets/game -name '*.png' | wc -l)"
          echo "Local asset bytes: $(du -sb assets/game | cut -f1)"
          echo "Built app bytes: $(wc -c < build/app.js)"
          echo "Lazy lookup bytes: $(($(wc -c < lookup-data-v46.js)+$(wc -c < lookup-extra-v49.js)))"
          echo "Lazy wardrobe bytes: $(wc -c < wardrobe-data-v34.js)"

      - name: Commit v67
        shell: bash
        run: |
          set -euo pipefail
          git config user.name quiet-axis2024
          git config user.email jinx.lin0820@gmail.com
          git add app.jsx index.html sw.js README.md DATA_PROVENANCE.md build-cloudflare.sh .github/workflows/pages.yml scripts assets lookup-data-v46.js wardrobe-data-v34.js
          git commit -m "v67: foundation language loading assets schema and wardrobe polish"
          git rm .github/workflows/v67-audit.yml scripts/apply-v67.py
          git commit -m "build: remove temporary v67 apply workflow"
          git push origin v67-foundation-polish
