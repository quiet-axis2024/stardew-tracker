name: Apply v67 foundation polish

on:
  push:
    branches: [v67-foundation-polish]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v67-foundation-polish
          fetch-depth: 0

      - name: Apply v67 foundation changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, json, hashlib, urllib.request, urllib.parse

          app_path=Path('app.jsx')
          app=app_path.read_text()

          replacements={
            '点人物卡 → 社交速查；点礼物 → 物品资料':'點人物卡 → 社交速查；點禮物 → 物品資料',
            '<SectionTitle icon="📦">城镇修复路线</SectionTitle>':'<SectionTitle icon="📦">城鎮修復路線</SectionTitle>',
            'Joja 仓库路线内容':'Joja 倉庫｜路線內容',
            '社区中心路线内容':'社区中心｜路線內容',
            '<SectionTitle icon="game:Farm Computer">农场设备</SectionTitle>':'<SectionTitle icon="game:Farm Computer">農場設備</SectionTitle>',
            '按用途分成工匠加工／精炼功能／农务设备；已补裁缝机、电话、迷你冰箱、迷你点唱机、精通雕像、分解机、铁砧、迷你锻造台与蟹笼等实用设施。':'按用途分成工匠加工／精煉功能／農務設備；已補裁縫機、電話、迷你冰箱、迷你點唱機、精通雕像、分解機、鐵砧、迷你鍛造台與蟹籠等實用設施。',
            '通用喜好分类':'通用喜好分類',
            '点击查看详细用途／来源':'點擊查看詳細用途／來源',
            '特殊物品／分类':'特殊物品／分類',
            '功能／服务':'功能／服務',
            '游戏里社区中心与 Joja 是二选一路线。确定把手帐当前路线切换成「${label}」吗？\\n另一条路线已记录的数据会保留，但不会同时计入当前路线。':'遊戲中社区中心與 Joja 是二選一路線。確定把手帳目前路線切換成「${label}」嗎？\\n另一條路線已記錄的資料會保留，但不會同時計入目前路線。',
          }
          for old,new in replacements.items(): app=app.replace(old,new)

          def remove_later_duplicate(text,key,value):
              needle=f'"{key}":"{value}"'
              hits=[m.start() for m in re.finditer(re.escape(needle),text)]
              if len(hits)<=1:return text
              pos=hits[-1];before=text[:pos];after=text[pos+len(needle):]
              if before.endswith(','):before=before[:-1]
              elif after.startswith(','):after=after[1:]
              return before+after
          app=remove_later_duplicate(app,'仙人掌果子','Cactus Fruit')
          app=remove_later_duplicate(app,'野山葵','Wild Horseradish')

          old='''const WIKI_FILE = (name) => `https://stardewvalleywiki.com/Special:Redirect/file/${encodeURIComponent(name + ".png")}`;\nconst iconMap = (names) => Object.fromEntries(names.map((name, i) => [i, WIKI_FILE(name)]));\n\n\nconst GAME_FILE = WIKI_FILE;'''
          new='''const WIKI_FILE = (name) => `https://stardewvalleywiki.com/Special:Redirect/file/${encodeURIComponent(name + ".png")}`;\nconst GAME_FILE = (name) => window.SDVLocalGameFilesV67?.[name] || WIKI_FILE(name);\nconst iconMap = (names) => Object.fromEntries(names.map((name, i) => [i, GAME_FILE(name)]));'''
          if old not in app: raise SystemExit('GAME_FILE block not found')
          app=app.replace(old,new)

          old='selected:{hat:typeof safe.hat==="string"?safe.hat:"",shirt:typeof safe.shirt==="string"?safe.shirt:"",pants:typeof safe.pants==="string"?safe.pants:"",boots:typeof safe.boots==="string"?safe.boots:""},'
          new='selected:{hat:typeof safe.hat==="string"?safe.hat:"",shirt:(typeof safe.shirt==="string"&&safe.shirt)?safe.shirt:"Shirt003",pants:(typeof safe.pants==="string"&&safe.pants)?safe.pants:"Farmer Pants",boots:typeof safe.boots==="string"?safe.boots:""},'
          if old not in app: raise SystemExit('wardrobe selected block not found')
          app=app.replace(old,new,1)
          app=app.replace('api.draw(ref.current,{...opts,selected:{hat:"",shirt:"",pants:"",boots:""},accessoryIndex:-1})','api.draw(ref.current,{...opts,selected:{hat:"",shirt:"Shirt003",pants:"Farmer Pants",boots:""},accessoryIndex:-1})',1)

          state_anchor='  const [wardrobeAppearanceMetaV37, setWardrobeAppearanceMetaV37] = useState({hairCount:64,skinCount:24,accessoryCount:29,defaultEyeColor:"#5B4636"});\n'
          if state_anchor not in app: raise SystemExit('lazy state anchor not found')
          app=app.replace(state_anchor,state_anchor+'  const [, setLazyDataRevisionV67] = useState(0);\n',1)

          effect_anchor='''  const profileInputRef = useRef(null);\n  const saveTimer = useRef(null);\n\n  useEffect(()=>{\n    let alive=true;'''
          effect_insert='''  const profileInputRef = useRef(null);\n  const saveTimer = useRef(null);\n\n  const loadLazyDataV67 = async group => {\n    const api=window.SDVLazyDataV67;\n    if(!api?.load)return false;\n    try{await api.load(group);setLazyDataRevisionV67(v=>v+1);return true;}\n    catch(error){console.warn(`lazy data load failed: ${group}`,error);return false;}\n  };\n  useEffect(()=>{\n    if(tab==="wardrobe")loadLazyDataV67("wardrobe");\n    if(tab==="fishing"||tab==="people")loadLazyDataV67("lookup");\n  },[tab]);\n  useEffect(()=>{\n    const run=()=>{if(!window.SDVLookupV46)loadLazyDataV67("lookup")};\n    if("requestIdleCallback" in window){const id=window.requestIdleCallback(run,{timeout:5000});return()=>window.cancelIdleCallback?.(id);}\n    const id=window.setTimeout(run,2800);return()=>window.clearTimeout(id);\n  },[]);\n\n  useEffect(()=>{\n    let alive=true;'''
          if effect_anchor not in app: raise SystemExit('lazy effect anchor not found')
          app=app.replace(effect_anchor,effect_insert,1)

          open_old='''  const openItemLookupV54 = (raw, preferredKey="") => {\n    const row = lookupRowV54(raw);'''
          open_new='''  const openItemLookupV54 = async (raw, preferredKey="") => {\n    if(!window.SDVLookupV46) await loadLazyDataV67("lookup");\n    const row = lookupRowV54(raw);'''
          if open_old not in app: raise SystemExit('openItemLookup block not found')
          app=app.replace(open_old,open_new,1)
          app_path.write_text(app)

          text=app
          asset_dir=Path('assets/game');asset_dir.mkdir(parents=True,exist_ok=True)
          core_names={'Warp Totem Farm','Stardew Valley Almanac','Bouquet','Magnifying Glass','Deluxe Cowboy Hat','Journal Scrap','Calendar','Golden Scroll','Golden Tag','Book Of Stars','Pickaxe','Stardrop','Silo','Sunfish','Friendship 101','Letter','Chest','Map','Ginger Island Map','Calendar Spring ZH','Calendar Summer ZH','Calendar Fall ZH','Calendar Winter ZH','Farm Computer'}
          names=set(core_names)
          def object_values(const_name):
              m=re.search(rf'const {re.escape(const_name)} = \{{(.*?)\n\}};',text,re.S)
              return set(re.findall(r':\s*"([^"]+)"',m.group(1))) if m else set()
          names |= object_values('NPC_ICON_FILES')
          names |= object_values('SECTION_ICON_FILES_V65')
          tabm=re.search(r'const TABS = \[(.*?)\n\];',text,re.S)
          if tabm:names |= set(re.findall(r'file:\s*"([^"]+)"',tabm.group(1)))

          mapping={};failed=[]
          opener=urllib.request.build_opener();opener.addheaders=[('User-Agent','Mozilla/5.0 StardewTracker/1.0')]
          for name in sorted(names):
              url='https://stardewvalleywiki.com/Special:Redirect/file/'+urllib.parse.quote(name+'.png')
              try:
                  with opener.open(url,timeout=20) as r:data=r.read();ctype=(r.headers.get('Content-Type') or '').lower()
                  if not data or ('image' not in ctype and not data.startswith(b'\x89PNG')):raise RuntimeError(f'not image: {ctype}')
                  fname=hashlib.sha1(name.encode()).hexdigest()[:14]+'.png';(asset_dir/fname).write_bytes(data);mapping[name]=f'./assets/game/{fname}'
              except Exception as exc:failed.append((name,str(exc)))
          logo_url='https://stardewvalleywiki.com/mediawiki/images/0/07/Main_Logo_ZH.png';logo_path=asset_dir/'main-logo-zh.png'
          try:
              with opener.open(logo_url,timeout=20) as r:logo_path.write_bytes(r.read())
          except Exception as exc:failed.append(('Main_Logo_ZH',str(exc)))
          (asset_dir/'local-assets-v67.js').write_text('window.SDVLocalGameFilesV67='+json.dumps(mapping,ensure_ascii=False,separators=(',',':'))+';\n')
          print('local assets:',len(mapping),'failed:',len(failed))
          for item in failed:print('asset fallback:',item[0],item[1])

          idx_path=Path('index.html');idx=idx_path.read_text()
          idx=idx.replace('https://stardewvalleywiki.com/mediawiki/images/0/07/Main_Logo_ZH.png','./assets/game/main-logo-zh.png')
          idx=idx.replace('  <script src="./cloud.js?v=66"></script>','  <script src="./assets/game/local-assets-v67.js?v=67"></script>\n  <script src="./cloud.js?v=67"></script>')
          idx=idx.replace('  <script src="./wardrobe-data-v34.js?v=66"></script>\n','').replace('  <script src="./lookup-data-v46.js?v=66"></script>\n','').replace('  <script src="./lookup-extra-v49.js?v=66"></script>\n','')
          idx=idx.replace('?v=66','?v=67')
          lazy='''    window.SDVLazyDataV67=(()=>{\n      const groups={lookup:[\"./lookup-data-v46.js?v=67\",\"./lookup-extra-v49.js?v=67\"],wardrobe:[\"./wardrobe-data-v34.js?v=67\"]};\n      const scripts=new Map(),groupLoads=new Map();\n      const loadScript=src=>{if(scripts.has(src))return scripts.get(src);const promise=new Promise((resolve,reject)=>{const el=document.createElement(\"script\");el.src=src;el.async=true;el.onload=()=>resolve(src);el.onerror=()=>reject(new Error(`無法載入 ${src}`));document.head.appendChild(el);});scripts.set(src,promise);return promise;};\n      const load=group=>{if(groupLoads.has(group))return groupLoads.get(group);const list=groups[group]||[];const promise=list.reduce((p,src)=>p.then(()=>loadScript(src)),Promise.resolve());groupLoads.set(group,promise);return promise;};\n      return {load};\n    })();\n'''
          marker='  <script>\n    (async()=>{'
          if marker not in idx:raise SystemExit('index loader marker not found')
          idx=idx.replace(marker,'  <script>\n'+lazy+'    (async()=>{',1).replace('<!-- deploy-v66 -->','<!-- deploy-v67 -->')
          idx_path.write_text(idx)

          p=Path('build-cloudflare.sh');s=p.read_text();s=s.replace('switch-names-v47.js dist/','switch-names-v47.js dist/\ncp -R assets dist/');p.write_text(s)
          pages=Path('.github/workflows/pages.yml');s=pages.read_text();s=s.replace('switch-names-v47.js dist/','switch-names-v47.js dist/\n          cp -R assets dist/');pages.write_text(s)

          swp=Path('sw.js');sw=swp.read_text().replace("const CACHE='stardew-tracker-v66';","const CACHE='stardew-tracker-v67';")
          core_paths=['./assets/game/local-assets-v67.js','./assets/game/main-logo-zh.png']+[mapping[n] for n in sorted(core_names) if n in mapping]
          m=re.search(r"const CORE=\[(.*?)\];",sw,re.S)
          if not m:raise SystemExit('SW CORE not found')
          existing=re.findall(r"'([^']+)'",m.group(1));merged=[]
          for x in existing+core_paths:
              if x not in merged:merged.append(x)
          sw=sw[:m.start()]+"const CORE=["+','.join(repr(x) for x in merged)+"];"+sw[m.end():];swp.write_text(sw)

          scripts=Path('scripts');scripts.mkdir(exist_ok=True)
          Path('scripts/audit-foundation-v67.py').write_text(r'''from pathlib import Path
import re, sys
text=Path('app.jsx').read_text()
forbidden=['城镇修复路线','Joja 仓库路线内容','社区中心路线内容','点人物卡 → 社交速查；点礼物 → 物品资料','>农场设备<','通用喜好分类','点击查看详细用途／来源','特殊物品／分类','功能／服务']
bad=[x for x in forbidden if x in text]
if bad: print('App-owned Simplified UI regressions:',bad);sys.exit(1)
m=re.search(r'const ITEM_FILE_ZH_V26 = \{(.*?)\n\};',text,re.S)
if m:
 keys=re.findall(r'"([^"]+)"\s*:',m.group(1));dup=sorted({k for k in keys if keys.count(k)>1})
 if dup: print('Duplicate ITEM_FILE_ZH_V26 keys:',dup);sys.exit(1)
if 'window.SDVLocalGameFilesV67?.[name] || WIKI_FILE(name)' not in text: print('Local image fallback missing');sys.exit(1)
if 'shirt:"Shirt003",pants:"Farmer Pants"' not in text: print('Wardrobe neutral preview fallback missing');sys.exit(1)
idx=Path('index.html').read_text()
for src in ['wardrobe-data-v34.js','lookup-data-v46.js','lookup-extra-v49.js']:
 if f'<script src="./{src}?v=67"' in idx: print('Heavy data still parser-blocking:',src);sys.exit(1)
print('v67 foundation audit passed')
''')

          readme=Path('README.md');r=readme.read_text();anchor='## 資料來源與聲明\n'
          convention='''## 語言與資產規則\n\n- App 自己的介面、說明與功能文案使用繁體中文（台灣用語）。\n- 遊戲內專有名詞以 Switch 版《星露谷物語》遊戲本體實際顯示為準；搜尋別名另外支援繁中／簡中／英文，不用顯示字串當資料 ID。\n- 高頻導航、NPC 頭像、日曆／地圖等核心圖優先由 repo 內 `assets/game` 提供；未本地化的遊戲圖仍可回退 Stardew Valley Wiki，並由 Service Worker runtime cache。\n- 大型查找與完整衣櫥目錄採延後載入，後續「世界／NPC 行程／完整分類」等資料模組也沿用此原則。\n\n'''
          if convention not in r:r=r.replace(anchor,convention+anchor)
          readme.write_text(r)
          PY

      - name: Validate v67
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit-foundation-v67.py
          node --check sw.js
          node --check assets/game/local-assets-v67.js
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8 eslint@9
          mkdir -p build
          cat > build/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React = React;
          window.ReactDOM = { createRoot };
          EOF
          cat app.jsx >> build/entry.jsx
          ./node_modules/.bin/esbuild build/entry.jsx --bundle --minify --format=iife --target=safari15 --outfile=build/app.js 2>build/esbuild.stderr
          cat build/esbuild.stderr
          if grep -q '\[WARNING\]' build/esbuild.stderr; then echo 'Unexpected esbuild warning'; exit 1; fi
          cat > build/eslint.config.mjs <<'EOF'
          export default [{files:['entry-lint.jsx'],languageOptions:{parserOptions:{ecmaVersion:'latest',sourceType:'module',ecmaFeatures:{jsx:true}},globals:{window:'readonly',document:'readonly',navigator:'readonly',localStorage:'readonly',URL:'readonly',Image:'readonly',FileReader:'readonly',Blob:'readonly',confirm:'readonly',alert:'readonly',requestAnimationFrame:'readonly',setTimeout:'readonly',clearTimeout:'readonly',fetch:'readonly',React:'readonly',ReactDOM:'readonly'}},rules:{'no-undef':'error'}}];
          EOF
          cp build/entry.jsx build/entry-lint.jsx
          (cd build && ../node_modules/.bin/eslint --config eslint.config.mjs entry-lint.jsx --no-ignore)
          test -s assets/game/main-logo-zh.png
          test -s assets/game/local-assets-v67.js
          echo "Local game assets: $(find assets/game -name '*.png' | wc -l)"
          echo "Built app bytes: $(wc -c < build/app.js)"

      - name: Commit v67
        shell: bash
        run: |
          set -euo pipefail
          git config user.name quiet-axis2024
          git config user.email jinx.lin0820@gmail.com
          git add app.jsx index.html sw.js README.md build-cloudflare.sh .github/workflows/pages.yml scripts assets
          git commit -m "v67: foundation language loading assets and wardrobe polish"
          git rm .github/workflows/v67-audit.yml
          git commit -m "build: remove temporary v67 workflow"
          git push origin v67-foundation-polish
