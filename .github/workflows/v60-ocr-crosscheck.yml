name: Apply v60 OCR cross-check
on:
  push:
    branches: [v60-ocr-crosscheck]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v60-ocr-crosscheck
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/v60_ocr_crosscheck.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save eslint@8 react@18 react-dom@18 esbuild@0.25.8 >/dev/null 2>&1
          ./node_modules/.bin/eslint app.jsx --no-eslintrc --env browser,es2021 --parser-options '{"ecmaVersion":2022,"sourceType":"script","ecmaFeatures":{"jsx":true}}' --global React --global ReactDOM --rule 'no-undef:error'
          grep -q 'hudDayColorV60 = makeCrop(img, 0.882, 0.018, 0.018, 0.050, 10, false)' app.jsx
          grep -q 'profileDayV60' app.jsx
          grep -q 'hudDayV60' app.jsx
          grep -q 'seasonA59 && seasonB59 && seasonA59 === seasonB59' app.jsx
          grep -q 'app.js?v=60' index.html
          grep -q 'stardew-tracker-v60' sw.js
          mkdir -p build
          printf '%s\n' "import React from 'react';" "import { createRoot } from 'react-dom/client';" "window.React = React;" "window.ReactDOM = { createRoot };" > build/entry.jsx
          cat app.jsx >> build/entry.jsx
          ./node_modules/.bin/esbuild build/entry.jsx --bundle --minify --format=iife --target=safari15 --outfile=/tmp/v60-app.js
          test -s /tmp/v60-app.js
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx index.html sw.js
          git commit -m 'v60: cross-check screenshot date and season'
          git push origin HEAD:v60-ocr-crosscheck
