name: Finalize v67 foundation

on:
  push:
    branches: [v67-foundation-polish]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v67-foundation-polish
          fetch-depth: 0

      - name: Apply product changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'BOOT'
          from pathlib import Path
          import re, textwrap
          source=Path('.github/workflows/v67-fix.yml').read_text()
          match=re.search(r"python3 <<'PY'\n(.*?)\n          PY",source,re.S)
          if not match:
              raise SystemExit('embedded v67 apply script not found')
          code=textwrap.dedent(match.group(1))
          exec(compile(code,'v67-apply-embedded.py','exec'))
          BOOT

      - name: Validate product and builds
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit-foundation-v67.py
          node --check sw.js
          node --check assets/game/local-assets-v67.js
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8 eslint@9
          mkdir -p build
          printf '%s\n' "import React from 'react';" "import { createRoot } from 'react-dom/client';" "window.React=React; window.ReactDOM={createRoot};" > build/entry.jsx
          cat app.jsx >> build/entry.jsx
          ./node_modules/.bin/esbuild build/entry.jsx --bundle --minify --format=iife --target=safari15 --outfile=build/app.js 2>build/esbuild.err
          cat build/esbuild.err
          if grep -q '\[WARNING\]' build/esbuild.err; then echo 'Unexpected esbuild warning'; exit 1; fi
          cat > build/eslint.config.mjs <<'EOF'
          export default [{files:['entry.jsx'],languageOptions:{parserOptions:{ecmaVersion:'latest',sourceType:'module',ecmaFeatures:{jsx:true}},globals:{window:'readonly',document:'readonly',navigator:'readonly',localStorage:'readonly',URL:'readonly',Image:'readonly',FileReader:'readonly',Blob:'readonly',confirm:'readonly',alert:'readonly',prompt:'readonly',console:'readonly',requestAnimationFrame:'readonly',setTimeout:'readonly',clearTimeout:'readonly',fetch:'readonly',React:'readonly',ReactDOM:'readonly'}},rules:{'no-undef':'error'}}];
          EOF
          (cd build && ../node_modules/.bin/eslint --config eslint.config.mjs entry.jsx --no-ignore)
          test $(find assets/game -name '*.png' | wc -l) -ge 20
          bash build-cloudflare.sh
          test -s dist/app.js
          test -s dist/assets/game/local-assets-v67.js
          test -s dist/assets/game/main-logo-zh.png
          test -s dist/lookup-data-v46.js
          test -s dist/wardrobe-data-v34.js
          echo "LOCAL_ASSETS=$(find assets/game -name '*.png' | wc -l)"
          echo "APP_BYTES=$(wc -c < build/app.js)"
          echo "DIST_BYTES=$(du -sb dist | cut -f1)"

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name quiet-axis2024
          git config user.email jinx.lin0820@gmail.com
          git add app.jsx index.html sw.js README.md build-cloudflare.sh .github/workflows/pages.yml scripts assets
          git commit -m "v67: foundation language loading assets and wardrobe polish"
          git rm .github/workflows/v67-audit.yml .github/workflows/v67-apply.yml .github/workflows/v67-fix.yml .github/workflows/v67-final.yml
          git commit -m "build: remove temporary v67 workflows"
          git push origin v67-foundation-polish
