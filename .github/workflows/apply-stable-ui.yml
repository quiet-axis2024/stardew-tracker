name: Apply stable UI and cloud integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-stable-ui.yml'
      - '.apply-stable-ui-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write stable bootstrap, cloud sync and game UI enhancer
        shell: bash
        run: |
          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="zh-Hant">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
            <meta name="theme-color" content="#4a2f20" />
            <meta name="apple-mobile-web-app-capable" content="yes" />
            <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
            <meta name="apple-mobile-web-app-title" content="星露谷手帳" />
            <link rel="manifest" href="./manifest.webmanifest" />
            <link rel="icon" href="./icon.svg" type="image/svg+xml" />
            <title>星露谷進度手帳</title>
            <style>
              html,body,#root{margin:0;min-height:100%;background:#5a3825}*{box-sizing:border-box}
              body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
              button,input,textarea,select{font:inherit}
              #boot-status{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#f4ddb0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:800;text-align:center}
            </style>
          </head>
          <body>
            <div id="root"><div id="boot-status">🌱 載入星露谷手帳…</div></div>
            <script src="./cloud.js?v=7"></script>
            <script src="./theme.js?v=7" defer></script>
            <script>
              (async()=>{
                const root=document.getElementById('root');
                const fail=(msg)=>{root.innerHTML='<div id="boot-status">⚠️ 手帳載入失敗<br><small style="margin-top:8px;display:block;font-weight:600">'+String(msg)+'</small><button onclick="location.reload()" style="margin-top:16px;padding:9px 14px;border:2px solid #e7bd67;border-radius:9px;background:#fff1c9;color:#4a2f20;font-weight:800">重新載入</button></div>'};
                window.addEventListener('error',e=>{if(!window.__SDV_APP_READY__) fail(e.message||'JavaScript error')});
                try{if(window.SDVCloud) await window.SDVCloud.init();}catch(e){console.warn('cloud init failed',e)}
                const s=document.createElement('script');
                s.src='./app.js?v=7';
                s.onload=()=>{window.__SDV_APP_READY__=true;};
                s.onerror=()=>fail('app.js 無法載入');
                document.body.appendChild(s);
              })();
              if('serviceWorker' in navigator){
                window.addEventListener('load',async()=>{
                  try{const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});await reg.update();}catch(e){console.warn('service worker',e)}
                });
              }
            </script>
          </body>
          </html>
          EOF

          cat > sw.js <<'EOF'
          const CACHE='stardew-tracker-v7';
          const CORE=['./index.html','./app.js','./cloud.js','./theme.js','./manifest.webmanifest','./icon.svg'];
          self.addEventListener('install',event=>{event.waitUntil(caches.open(CACHE).then(c=>Promise.allSettled(CORE.map(u=>c.add(u)))));self.skipWaiting();});
          self.addEventListener('activate',event=>{event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));self.clients.claim();});
          async function networkFirst(request){
            try{const response=await fetch(request,{cache:'no-store'});if(response&&(response.ok||response.type==='opaque')){const c=await caches.open(CACHE);c.put(request,response.clone());}return response;}
            catch(e){const hit=await caches.match(request);if(hit)return hit;throw e;}
          }
          self.addEventListener('fetch',event=>{
            if(event.request.method!=='GET')return;
            const url=new URL(event.request.url);
            if(event.request.mode==='navigate'||(url.origin===location.origin&&(/\/(index\.html|app\.js|cloud\.js|theme\.js)$/.test(url.pathname)))){
              event.respondWith(networkFirst(event.request).catch(()=>caches.match('./index.html')));return;
            }
            event.respondWith((async()=>{const hit=await caches.match(event.request);if(hit)return hit;try{const r=await fetch(event.request);if(r&&(r.ok||r.type==='opaque')){const c=await caches.open(CACHE);c.put(event.request,r.clone());}return r;}catch(e){throw e;}})());
          });
          EOF

          cat > cloud.js <<'EOF'
          (()=>{
            const ENDPOINT='https://cobkkabxxoyxyecgmjql.supabase.co/functions/v1/stardew-cloud';
            const OWNER_STORE='sdv-cloud-owner-token-v1';
            const SHARE_STORE='sdv-cloud-share-token-v1';
            const KEYS=new Set(['sdv2-progress-pub','sdv2-progress-v3']);
            const proto=Storage.prototype;
            const rawGet=proto.getItem,rawSet=proto.setItem;
            const state={mode:'local',token:'',shareToken:'',updatedAt:null};
            let shareRaw=null,syncTimer=null,lastWrite='';
            const lsGet=k=>{try{return rawGet.call(localStorage,k)}catch(e){return null}};
            const lsSet=(k,v)=>{try{rawSet.call(localStorage,k,v)}catch(e){}};
            async function request(action,token,data){
              const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token,...(data?{data}:{})})});
              let body={};try{body=await r.json()}catch(e){}
              if(!r.ok)throw new Error(body.error||`cloud_${r.status}`);return body;
            }
            function localProgress(){
              for(const k of KEYS){const raw=lsGet(k);if(raw){try{return JSON.parse(raw)}catch(e){}}}return null;
            }
            function meaningful(obj){return obj&&typeof obj==='object'&&!Array.isArray(obj)&&Object.keys(obj).length>2;}
            function installOwnerSync(){
              if(proto.__sdvOwnerPatched)return;proto.__sdvOwnerPatched=true;
              proto.setItem=function(k,v){const out=rawSet.call(this,k,v);if(this===localStorage&&KEYS.has(String(k))&&state.mode==='owner'){clearTimeout(syncTimer);syncTimer=setTimeout(async()=>{try{const obj=JSON.parse(String(v));const encoded=JSON.stringify(obj);if(encoded===lastWrite)return;await request('write',state.token,obj);lastWrite=encoded;state.updatedAt=new Date().toISOString();document.dispatchEvent(new CustomEvent('sdv-cloud-status'));}catch(e){console.warn('cloud write',e)}},850);}return out;};
            }
            function installShareStorage(){
              if(proto.__sdvSharePatched)return;proto.__sdvSharePatched=true;
              proto.getItem=function(k){if(this===localStorage&&KEYS.has(String(k))&&shareRaw!==null)return shareRaw;return rawGet.call(this,k)};
              proto.setItem=function(k,v){if(this===localStorage&&KEYS.has(String(k)))return;return rawSet.call(this,k,v)};
            }
            async function init(){
              const u=new URL(location.href);const manage=u.searchParams.get('manage');const view=u.searchParams.get('view');const shareKey=u.searchParams.get('sharekey');
              if(manage){lsSet(OWNER_STORE,manage);if(shareKey)lsSet(SHARE_STORE,shareKey);state.mode='owner';state.token=manage;state.shareToken=shareKey||lsGet(SHARE_STORE)||'';u.searchParams.delete('manage');u.searchParams.delete('sharekey');history.replaceState({},'',u.pathname+(u.searchParams.toString()?`?${u.searchParams}`:'')+u.hash);}
              else if(view){state.mode='share';state.token=view;}
              else{const stored=lsGet(OWNER_STORE);if(stored){state.mode='owner';state.token=stored;state.shareToken=lsGet(SHARE_STORE)||'';}}
              document.documentElement.dataset.sdvCloudMode=state.mode;
              if(state.mode==='share'){
                const remote=await request('read',state.token);shareRaw=JSON.stringify(remote.data||{});state.updatedAt=remote.updated_at||null;installShareStorage();
                setInterval(async()=>{try{const next=await request('read',state.token);const raw=JSON.stringify(next.data||{});if(raw!==shareRaw){shareRaw=raw;location.reload();}}catch(e){}},30000);
              }else if(state.mode==='owner'){
                const local=localProgress();let remote=null;try{remote=await request('read',state.token);}catch(e){console.warn('cloud read',e)}
                if(remote&&meaningful(remote.data)){const raw=JSON.stringify(remote.data);for(const k of KEYS)lsSet(k,raw);lastWrite=raw;state.updatedAt=remote.updated_at||null;}
                else if(local){try{await request('write',state.token,local);lastWrite=JSON.stringify(local);}catch(e){console.warn('initial cloud write',e)}}
                installOwnerSync();
              }
              document.dispatchEvent(new CustomEvent('sdv-cloud-ready'));
            }
            function shareUrl(){return state.shareToken?`${location.origin}${location.pathname}?view=${encodeURIComponent(state.shareToken)}`:'';}
            async function copyShareLink(){const url=shareUrl();if(!url)throw new Error('no_share_token');if(navigator.clipboard)await navigator.clipboard.writeText(url);else prompt('請複製唯讀連結',url);return url;}
            window.SDVCloud={init,state,shareUrl,copyShareLink};
          })();
          EOF

          cat > theme.js <<'EOF'
          (()=>{
            const file=name=>`https://stardewvalleywiki.com/Special:Redirect/file/${encodeURIComponent(name+'.png')}`;
            const nav={總覽:'Inventory Tab',技能:'Skills Tab Icon',社區:'Junimo Icon',農場:'Animals Tab',社交:'Social Tab',圖鑑:'Collections Tab',備註:'Special Items & Powers Tab'};
            const titles={
              '日期與資金':'Inventory Tab','進度速覽':'Stardrop','重要里程碑':'Stardrop','特殊物品與能力':'Special Items & Powers Tab',
              '技能等級':'Skills Tab Icon','礦井':'Pickaxe','精通':'Stardrop','社區中心':'Junimo Icon','農舍':'House (tier 2)','工具':'Pickaxe','建築':'Silo',
              '雞舍動物':'White Chicken','牲口棚動物':'Cow','魚塘':'Fish Pond','社交':'Social Tab','可交往對象':'Bouquet','村民':'Social Tab','特殊角色':'Void Essence',
              '圖鑑':'Collections Tab','備註':'Special Items & Powers Tab','分享進度':'Letter','完整備份':'Chest','分享給朋友':'Social Tab','手機使用':'Inventory Tab','資料管理':'Trash Can'
            };
            const room={'工藝室':'Junimo Icon','食品儲藏室':'Parsnip','魚缸':'Sunfish','鍋爐房':'Copper Bar','布告欄':'Letter','保險庫':'Gold'};
            const tools={'水壺':'Watering Can','十字鎬':'Pickaxe','斧頭':'Axe','鋤頭':'Hoe','垃圾桶':'Trash Can'};
            const animals={'藍雞':'Blue Chicken','虛空雞':'Void Chicken','金雞':'Golden Chicken','雞':'White Chicken','鴨':'Duck','兔子':'Rabbit','恐龍':'Dinosaur','牛':'Cow','山羊':'Goat','綿羊':'Sheep','豬':'Pig','鴕鳥':'Ostrich'};
            const npcs={阿比蓋爾:'Abigail',艾蜜麗:'Emily',海莉:'Haley',莉亞:'Leah',瑪魯:'Maru',潘妮:'Penny',亞歷克斯:'Alex',艾利歐特:'Elliott',哈維:'Harvey',山姆:'Sam',塞巴斯蒂安:'Sebastian',謝恩:'Shane',卡洛琳:'Caroline',克林特:'Clint',德米特里厄斯:'Demetrius',艾芙琳:'Evelyn',喬治:'George',格斯:'Gus',賈斯:'Jas',喬迪:'Jodi',肯特:'Kent',劉易斯:'Lewis',萊納斯:'Linus',瑪妮:'Marnie',潘姆:'Pam',皮埃爾:'Pierre',羅賓:'Robin',文森特:'Vincent',威利:'Willy',法師:'Wizard',桑迪:'Sandy',克羅巴斯:'Krobus',矮人:'Dwarf',雷歐:'Leo'};
            function sprite(name,size=30,extra=''){const i=document.createElement('img');i.src=file(name);i.alt='';i.dataset.sdvSprite=name;i.className='sdv-game-icon '+extra;i.style.width=size+'px';i.style.height=size+'px';i.style.objectFit='contain';i.style.imageRendering='pixelated';i.loading='lazy';return i;}
            function setSprite(el,name,size=30){if(!el)return;const old=el.querySelector(':scope > img[data-sdv-sprite]');if(old&&old.dataset.sdvSprite===name)return;el.textContent='';el.appendChild(sprite(name,size));el.style.display='inline-flex';el.style.alignItems='center';el.style.justifyContent='center';}
            function directText(el){return [...el.childNodes].filter(n=>n.nodeType===3).map(n=>n.nodeValue).join('');}
            function enhance(){
              const sticky=[...document.querySelectorAll('div')].find(d=>d.style.position==='sticky'&&d.textContent.includes('星露谷進度手帳'));if(sticky){const s=sticky.querySelector('span');setSprite(s,'Junimo Icon',38);}
              document.querySelectorAll('div[style*="position: fixed"] button').forEach(btn=>{const spans=btn.querySelectorAll(':scope > span');if(spans.length<2)return;const label=spans[spans.length-1].textContent.trim();if(nav[label])setSprite(spans[0],nav[label],34);});
              document.querySelectorAll('main span').forEach(label=>{if(label.style.fontSize!=='17px')return;const t=label.textContent.trim();const key=Object.keys(titles).find(k=>t.startsWith(k));if(key){const icon=label.parentElement?.firstElementChild;if(icon&&icon!==label)setSprite(icon,titles[key],28);}});
              document.querySelectorAll('main b').forEach(b=>{const t=b.textContent.trim();if(room[t]){const row=b.parentElement?.parentElement;const icon=row?.firstElementChild;if(icon)setSprite(icon,room[t],34);}if(tools[t]){const row=b.parentElement;const icon=row?.querySelector('span');if(icon)setSprite(icon,tools[t],27);}if(npcs[t]){const row=b.parentElement;if(row&&!row.querySelector('img[data-sdv-npc]')){const i=sprite(npcs[t],38);i.dataset.sdvNpc='1';i.style.borderRadius='5px';i.style.marginRight='2px';row.insertBefore(i,b);}}});
              document.querySelectorAll('main label').forEach(label=>{if(!label.querySelector('input'))return;const normalized=label.textContent.replace(/[🐔🦆🐰🦖🐄🐐🐑🐖🦩\s]/g,'');for(const name of Object.keys(animals).sort((a,b)=>b.length-a.length)){if(normalized.startsWith(name)&&!label.querySelector('img[data-sdv-animal]')){const i=sprite(animals[name],27);i.dataset.sdvAnimal='1';label.insertBefore(i,label.firstChild);[...label.childNodes].filter(n=>n.nodeType===3).forEach(n=>n.nodeValue=n.nodeValue.replace(/[🐔🦆🐰🦖🐄🐐🐑🐖🦩]/g,''));break;}}});
              document.querySelectorAll('main button').forEach(btn=>{const t=btn.textContent.trim();const cats={魚類圖鑑:'Pufferfish',古物圖鑑:'Dwarf Scroll I',礦物圖鑑:'Emerald'};const k=Object.keys(cats).find(x=>t.includes(x));if(k&&!btn.querySelector('img[data-sdv-category]')){const i=sprite(cats[k],23);i.dataset.sdvCategory='1';btn.insertBefore(i,btn.firstChild);[...btn.childNodes].filter(n=>n.nodeType===3).forEach(n=>n.nodeValue=n.nodeValue.replace(/[🐟🏺💎]/g,''));btn.style.display='inline-flex';btn.style.alignItems='center';btn.style.gap='5px';}
                if(t==='♥'&&!btn.querySelector('img[data-sdv-heart]')){const i=sprite('HeartIconLarge',16);i.dataset.sdvHeart='1';if(btn.style.color&&btn.style.color.toLowerCase().includes('d8cf'))i.style.opacity='.22';btn.textContent='';btn.appendChild(i);}
              });
              const mode=window.SDVCloud?.state?.mode;if(mode==='share'){let banner=document.getElementById('sdv-cloud-banner');if(!banner){const main=document.querySelector('main');if(main){banner=document.createElement('div');banner.id='sdv-cloud-banner';banner.innerHTML='👀 <b>唯讀雲端紀錄</b>　會顯示玩家最新同步進度';banner.style.cssText='margin:8px 0 10px;padding:9px 11px;border:2px solid #4f84a8;border-radius:9px;background:#e3f1fb;color:#3d2a1f;font-size:12px';main.prepend(banner);}}}
              if(mode==='owner'&&window.SDVCloud?.state?.shareToken){document.querySelectorAll('main span').forEach(label=>{if(label.style.fontSize==='17px'&&label.textContent.trim().startsWith('分享給朋友')){const card=label.parentElement?.nextElementSibling;if(card&&!card.querySelector('[data-sdv-share-button]')){const btn=document.createElement('button');btn.dataset.sdvShareButton='1';btn.innerHTML='☁️ 複製我的唯讀遊玩紀錄連結';btn.style.cssText='margin-top:10px;width:100%;border:2px solid #4f84a8;background:#e3f1fb;color:#315f7c;border-radius:9px;padding:10px;font-weight:900';btn.onclick=async()=>{try{await window.SDVCloud.copyShareLink();const old=btn.textContent;btn.textContent='✓ 已複製唯讀連結';setTimeout(()=>btn.textContent=old,1600);}catch(e){alert('目前沒有可用的分享連結')}};card.appendChild(btn);}}});}
            }
            let queued=false;const schedule=()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;enhance();});};
            new MutationObserver(schedule).observe(document.documentElement,{subtree:true,childList:true,characterData:true});document.addEventListener('sdv-cloud-ready',schedule);document.addEventListener('DOMContentLoaded',schedule);setTimeout(schedule,200);setTimeout(schedule,1200);
          })();
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pages.yml')
          s=p.read_text()
          s=s.replace('cp index.html manifest.webmanifest icon.svg sw.js dist/','cp index.html manifest.webmanifest icon.svg sw.js cloud.js theme.js dist/')
          p.write_text(s)
          PY

          rm -f .github/workflows/cloud-sync-patch.yml .github/workflows/apply-stable-ui.yml .apply-stable-ui-trigger

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize mobile loading, cloud sync, and Stardew menu sprites"
          git push
