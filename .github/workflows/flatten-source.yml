name: Flatten Stardew Tracker Source

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply all existing build patches into app.jsx
        shell: bash
        run: |
          set -euo pipefail
          cp app.jsx app.flattened.jsx
          for patch in \
            build_patch.py \
            build_calendar_patch.py \
            build_ocr_patch.py \
            build_ocr_name_patch.py \
            build_menu_fridge_patch.py \
            build_fix_patch.py \
            build_cooking_collection_patch.py \
            build_cooking_postfix.py \
            build_collection_cooking_patch.py \
            build_collection_link_patch.py \
            build_ui_share_patch.py \
            build_tool_icon_postfix.py \
            build_fish_guide_patch.py \
            build_fish_guide_fix.py
          do
            echo "Applying $patch"
            python3 "$patch" app.flattened.jsx
          done
          mv app.flattened.jsx app.jsx

      - name: Validate flattened source compiles
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8
          mkdir -p build
          cat > build/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React = React;
          window.ReactDOM = { createRoot };
          EOF
          cat app.jsx >> build/entry.jsx
          ./node_modules/.bin/esbuild build/entry.jsx --bundle --minify --format=iife --target=safari15 --outfile=/tmp/app.js

      - name: Remove obsolete patch stack and temporary build files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            build_patch.py \
            build_calendar_patch.py \
            build_ocr_patch.py \
            build_ocr_name_patch.py \
            build_menu_fridge_patch.py \
            build_fix_patch.py \
            build_cooking_collection_patch.py \
            build_cooking_postfix.py \
            build_collection_cooking_patch.py \
            build_collection_link_patch.py \
            build_ui_share_patch.py \
            build_tool_icon_postfix.py \
            build_fish_guide_patch.py \
            build_fish_guide_fix.py \
            .flatten-trigger
          rm -rf node_modules build

      - name: Commit canonical app.jsx to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx
          git add -u -- '*.py' .flatten-trigger || true
          git commit -m 'Flatten generated tracker into canonical app.jsx'
          git push origin HEAD:main

      - name: Dispatch Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml --ref main
