name: Polish v67 copy boundary

on:
  push:
    branches: [v67-foundation-polish]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v67-foundation-polish
          fetch-depth: 0
      - name: Fix mixed wording introduced by conversion
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('app.jsx');s=p.read_text()
          fixes={
            '姜島船運':'姜岛船運',
            '前往姜島':'前往姜岛',
            '揹包升級':'背包升級',
            '揹包擴充':'背包擴充',
            '部分社群升級':'部分城鎮設施改善',
            '火山鍛造臺':'火山鍛造台'
          }
          for a,b in fixes.items(): s=s.replace(a,b)
          p.write_text(s)
          a=Path('scripts/audit-foundation-v67.py');t=a.read_text()
          t=t.replace("'鵜鶘鎮']","'鵜鶘鎮','姜島','揹包','社群升級','鍛造臺']")
          a.write_text(t)
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit-foundation-v67.py
          node --check sw.js
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8 eslint@9
          mkdir -p build
          cat > build/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React=React; window.ReactDOM={createRoot};
          EOF
          cat app.jsx >> build/entry.jsx
          ./node_modules/.bin/esbuild build/entry.jsx --bundle --minify --format=iife --target=safari15 --outfile=build/app.js 2>build/esbuild.stderr
          cat build/esbuild.stderr
          if grep -q '\[WARNING\]' build/esbuild.stderr; then exit 1; fi
      - name: Commit and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name quiet-axis2024
          git config user.email jinx.lin0820@gmail.com
          git add app.jsx scripts/audit-foundation-v67.py
          git commit -m "v67: polish language boundary wording"
          git rm .github/workflows/v67-copy-polish.yml
          git commit -m "build: remove temporary v67 copy workflow"
          git push origin v67-foundation-polish
