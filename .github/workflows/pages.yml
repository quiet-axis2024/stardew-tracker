name: Deploy Stardew Tracker to Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build browser bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit-foundation-v67.py
          python3 scripts/audit-progress-link-v68.py
          python3 scripts/audit-today-v69.py
          python3 scripts/audit-world-v70.py
          python3 scripts/audit-world-v71.py
          python3 scripts/audit-world-v72.py
          node --check world-data-v70.js
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8
          mkdir -p build dist
          cat > build/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React = React;
          window.ReactDOM = { createRoot };
          EOF
          cat app.jsx >> build/entry.jsx
          ./node_modules/.bin/esbuild build/entry.jsx --bundle --minify --format=iife --target=safari15 --outfile=dist/app.js
          cp index.html manifest.webmanifest icon.svg sw.js cloud.js wardrobe-data-v34.js farmer-preview-v33.js animal-preview-v33.js lookup-data-v46.js lookup-extra-v49.js social-data-v50.js machine-data-v51.js switch-names-v47.js world-data-v70.js dist/
          cp -R assets dist/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
