name: Deploy Stardew Tracker to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build browser bundle
        shell: bash
        run: |
          set -e
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8
          mkdir -p build dist
          cat > build/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React = React;
          window.ReactDOM = { createRoot };
          EOF
          cat app.jsx >> build/entry.jsx
          python3 build_patch.py build/entry.jsx
          python3 build_calendar_patch.py build/entry.jsx
          python3 build_ocr_patch.py build/entry.jsx
          python3 build_ocr_name_patch.py build/entry.jsx
          python3 build_menu_fridge_patch.py build/entry.jsx
          python3 build_fix_patch.py build/entry.jsx
          ./node_modules/.bin/esbuild build/entry.jsx --bundle --minify --format=iife --target=safari15 --outfile=dist/app.js
          cp index.html manifest.webmanifest icon.svg sw.js cloud.js dist/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
