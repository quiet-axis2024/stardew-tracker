name: Apply v46 complete lookup

on:
  push:
    branches: [v46-lookup-complete]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v46-lookup-complete
          fetch-depth: 0
      - name: Fetch pinned Stardew 1.6.15 data
        run: |
          set -euo pipefail
          mkdir -p /tmp/sdv-v46
          BASE='https://raw.githubusercontent.com/juliaramosguedes/stardew-data/4e0d98119afefd766f15ee77a529db4eb71fa240/data/en-US'
          for f in objects.json bigcraftables.json recipes.json shops.json boots.json weapons.json hats.json trinkets.json books.json; do
            curl -L --fail --silent --show-error "$BASE/$f" -o "/tmp/sdv-v46/$f"
          done
      - name: Apply v46 patch and generate local lookup data
        run: |
          set -euo pipefail
          python3 v46_patch.py
      - name: Validate v46
        run: |
          set -euo pipefail
          node --check lookup-data-v46.js
          node --check farmer-preview-v33.js
          node --check animal-preview-v33.js
          node --check wardrobe-data-v34.js
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8
          mkdir -p .verify
          cat > .verify/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React = React;
          window.ReactDOM = { createRoot };
          EOF
          cat app.jsx >> .verify/entry.jsx
          ./node_modules/.bin/esbuild .verify/entry.jsx --bundle --format=iife --target=safari15 --outfile=.verify/app.js
          grep -q 'window.SDVLookupV46' lookup-data-v46.js
          grep -q '櫻桃炸彈' lookup-data-v46.js
          grep -q '"Bomb"' lookup-data-v46.js
          grep -q '"Mega Bomb"' lookup-data-v46.js
          grep -q 'FISH_AREA_THUMB_V46' app.jsx
          grep -q 'fishFiltersOpenV46' app.jsx
          grep -q 'game:Magnifying Glass' app.jsx
          grep -q 'file="Sonar Bobber"' app.jsx
          grep -q 'file="Treasure Hunter"' app.jsx
          grep -q 'lookup-data-v46.js?v=46' index.html
          grep -q 'stardew-tracker-v46' sw.js
          ! grep -q 'WikiBtn name={selected.name}' <(sed -n '/const renderItemUsageV42/,/const renderFishTodayV4/p' app.jsx)
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          a=Path('app.jsx').read_text(encoding='utf-8')
          section=a[a.index('const renderItemUsageV42'):a.index('const renderFishTodayV4')]
          assert '查不到的再直接進 Wiki' not in section
          assert '直接用 Wiki 查' not in section
          assert 'recommendActionV46' in section
          assert '來源／取得方式' in section
          assert 'fontSize:9,fontWeight:950' in section
          fish=a[a.index('const renderFishFindV4'):a.index('const renderItemUsageV42')]
          assert '選具體水域／位置' in fish
          assert 'backgroundSize:"290% auto"' in fish
          assert 'fishFiltersOpenV46' in fish
          txt=Path('lookup-data-v46.js').read_text(encoding='utf-8')
          payload=json.loads(txt.split('=',1)[1].rsplit(';',1)[0])
          names={x['name']:x for x in payload['items']}
          assert len(names) > 700, len(names)
          assert names['Bomb']['zh']=='炸彈'
          assert any('製作' in x for x in names['Bomb']['sources'])
          assert names['Bomb']['recommend']=='留'
          print('v46 lookup records:',len(names))
          PY
      - name: Commit v46 code
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx index.html sw.js lookup-data-v46.js
          git rm -f v46_patch.py .github/workflows/v46-apply.yml
          git commit -m 'v46: complete lookup data and compact fish finder'
          git push origin HEAD:v46-lookup-complete
