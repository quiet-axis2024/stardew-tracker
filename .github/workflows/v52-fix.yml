name: Apply v52 mobile fixes
on:
  push:
    branches: [v52-mobile-fixes]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v52-mobile-fixes
          fetch-depth: 0

      - name: Apply product fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.jsx'); s=p.read_text()

          old='<Card style={{marginTop:9,padding:9,background:"#EEF3DA"}}><div style={{display:"flex",alignItems:"center",gap:8}}><GameIcon file="Joja Cola" size={36}/>'
          new='<Card style={{marginTop:9,padding:9,background:data.jojaMemberV28?"#EEF7DD":"#E5E1D8",filter:data.jojaMemberV28?"none":"grayscale(.9)",opacity:data.jojaMemberV28?1:.72}}><div style={{display:"flex",alignItems:"center",gap:8}}><GameIcon file="Joja Cola" size={36}/>'
          if old not in s: raise SystemExit('Joja member card marker missing')
          s=s.replace(old,new,1)

          old='background:data.jojaMemberV28?C.lightGreen:C.cream,borderRadius:8,padding:"5px 7px",fontWeight:950,color:data.jojaMemberV28?C.green:C.brown'
          new='background:data.jojaMemberV28?C.lightGreen:"#EEE9DE",borderRadius:8,padding:"5px 7px",fontWeight:950,color:data.jojaMemberV28?C.green:C.muted'
          if old not in s: raise SystemExit('Joja member button marker missing')
          s=s.replace(old,new,1)

          old='JOJA_PROJECTS_V28.map(j=>{const inherited=(data.bundleDone||[]).includes(j.room),on=inherited||jojaDone.includes(j.id);return <button key={j.id} disabled={inherited} onClick={()=>update({jojaProjectsV28:on?jojaDone.filter(x=>x!==j.id):[...jojaDone,j.id]})} style={{border:`2px solid ${on?C.green:C.line}`,background:on?"#EAF4D8":C.paper,borderRadius:10,padding:8,textAlign:"left",cursor:inherited?"default":"pointer",opacity:inherited?.75:1}}>'
          new='JOJA_PROJECTS_V28.map(j=>{const inherited=(data.bundleDone||[]).includes(j.room),on=inherited||jojaDone.includes(j.id),locked=!data.jojaMemberV28&&!on;return <button key={j.id} disabled={inherited||locked} onClick={()=>update({jojaProjectsV28:on?jojaDone.filter(x=>x!==j.id):[...jojaDone,j.id]})} style={{border:`2px solid ${on?C.green:C.line}`,background:on?"#EAF4D8":locked?"#E5E1D8":C.paper,borderRadius:10,padding:8,textAlign:"left",cursor:inherited||locked?"default":"pointer",filter:locked?"grayscale(.9)":"none",opacity:inherited?.75:locked?.62:1}}>'
          if old not in s: raise SystemExit('Joja projects marker missing')
          s=s.replace(old,new,1)

          old='<Card style={{padding:9,background:raccoonV50.stump?"#EEF7DD":C.paper}}>'
          new='<Card style={{padding:9,background:raccoonV50.stump?"#EEF7DD":"#E5E1D8",filter:raccoonV50.stump?"none":"grayscale(.9)",opacity:raccoonV50.stump?1:.72}}>'
          if old not in s: raise SystemExit('Raccoon card marker missing')
          s=s.replace(old,new,1)

          old='background:raccoonV50.stump?C.lightGreen:C.cream,borderRadius:7,padding:"5px 7px",fontSize:8.5,fontWeight:950,color:raccoonV50.stump?C.green:C.brown'
          new='background:raccoonV50.stump?C.lightGreen:"#EEE9DE",borderRadius:7,padding:"5px 7px",fontSize:8.5,fontWeight:950,color:raccoonV50.stump?C.green:C.muted'
          if old not in s: raise SystemExit('Raccoon button marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('index.html'); h=p.read_text()
          if '?v=51' not in h: raise SystemExit('index v51 marker missing')
          p.write_text(h.replace('?v=51','?v=52').replace('<!-- deploy-v51 -->','<!-- deploy-v52 -->'))

          p=Path('sw.js'); w=p.read_text()
          if 'stardew-tracker-v51' not in w: raise SystemExit('sw v51 marker missing')
          p.write_text(w.replace('stardew-tracker-v51','stardew-tracker-v52',1))
          PY

      - name: Validate source, social lookup and Pages artifact list
        shell: bash
        run: |
          set -euo pipefail
          node --check lookup-data-v46.js
          node --check lookup-extra-v49.js
          node --check social-data-v50.js
          node --check machine-data-v51.js
          node --check switch-names-v47.js
          node --check sw.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app.jsx').read_text()
          assert 'openNpc' not in s and 'setOpenNpc' not in s
          assert 'background:data.jojaMemberV28?"#EEF7DD":"#E5E1D8"' in s
          assert 'locked=!data.jojaMemberV28&&!on' in s
          assert 'background:raccoonV50.stump?"#EEF7DD":"#E5E1D8"' in s
          y=Path('.github/workflows/pages.yml').read_text()
          for f in ['lookup-data-v46.js','lookup-extra-v49.js','social-data-v50.js','machine-data-v51.js','switch-names-v47.js']:
              assert f in y, f+' missing from Pages artifact'
          assert '?v=52' in Path('index.html').read_text()
          assert 'stardew-tracker-v52' in Path('sw.js').read_text()
          print('v52 source checks passed')
          PY
          node <<'NODE'
          global.window={};
          require('./lookup-data-v46.js');
          require('./social-data-v50.js');
          const rows=window.SDVLookupV46.items;
          const samples=['Amethyst','Banana Pudding','Blackberry Cobbler','Chocolate Cake','Pufferfish','Pumpkin','Spicy Eel','Quartz','Holly'];
          for(const name of samples){if(!rows.some(r=>r.name===name||r.file===name||r.zh===name)) throw new Error('social lookup sample missing: '+name);}
          if(!window.SDVSocialV50.byZh['阿比蓋爾']) throw new Error('Abigail profile missing');
          console.log('social lookup samples resolve');
          NODE

      - name: Build Safari bundle and complete dist smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8 >/dev/null 2>&1
          mkdir -p build /tmp/v52dist
          cat > build/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React = React;
          window.ReactDOM = { createRoot };
          EOF
          cat app.jsx >> build/entry.jsx
          ./node_modules/.bin/esbuild build/entry.jsx --bundle --minify --format=iife --target=safari15 --outfile=/tmp/v52dist/app.js
          cp index.html manifest.webmanifest icon.svg sw.js cloud.js wardrobe-data-v34.js farmer-preview-v33.js animal-preview-v33.js lookup-data-v46.js lookup-extra-v49.js social-data-v50.js machine-data-v51.js switch-names-v47.js /tmp/v52dist/
          for f in app.js index.html lookup-data-v46.js lookup-extra-v49.js social-data-v50.js machine-data-v51.js switch-names-v47.js; do test -s /tmp/v52dist/$f; done

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.jsx index.html sw.js
          git commit -m "v52: fix inactive states and refresh mobile cache"
          git push origin HEAD:v52-mobile-fixes
