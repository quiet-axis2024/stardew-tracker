name: Final v67 foundation pass

on:
  push:
    branches: [v67-foundation-polish]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v67-foundation-polish
          fetch-depth: 0

      - name: Apply foundation finalizer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet opencc-python-reimplemented
          python3 scripts/finalize-v67.py

      - name: Validate source and browser bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit-foundation-v67.py
          node --check sw.js
          node --check assets/game/local-assets-v67.js
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8 eslint@9
          mkdir -p build
          cat > build/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React = React;
          window.ReactDOM = { createRoot };
          EOF
          cat app.jsx >> build/entry.jsx
          ./node_modules/.bin/esbuild build/entry.jsx --bundle --minify --format=iife --target=safari15 --outfile=build/app.js 2>build/esbuild.stderr
          cat build/esbuild.stderr
          if grep -q '\[WARNING\]' build/esbuild.stderr; then echo 'Unexpected esbuild warning'; exit 1; fi
          cat > build/eslint.config.mjs <<'EOF'
          export default [{files:['entry.jsx'],languageOptions:{parserOptions:{ecmaVersion:'latest',sourceType:'module',ecmaFeatures:{jsx:true}},globals:{window:'readonly',document:'readonly',navigator:'readonly',localStorage:'readonly',URL:'readonly',Image:'readonly',FileReader:'readonly',Blob:'readonly',confirm:'readonly',alert:'readonly',prompt:'readonly',console:'readonly',requestAnimationFrame:'readonly',setTimeout:'readonly',clearTimeout:'readonly',fetch:'readonly',React:'readonly',ReactDOM:'readonly'}},rules:{'no-undef':'error'}}];
          EOF
          (cd build && ../node_modules/.bin/eslint --config eslint.config.mjs entry.jsx --no-ignore)

      - name: Build deploy output and record baseline
        shell: bash
        run: |
          set -euo pipefail
          bash build-cloudflare.sh
          test -s dist/app.js
          test -s dist/assets/game/local-assets-v67.js
          test -s dist/assets/game/main-logo-zh.png
          test -s dist/lookup-data-v46.js
          test -s dist/wardrobe-data-v34.js
          python3 <<'PY'
          from pathlib import Path
          import json,re
          app=Path('build/app.js').stat().st_size
          files={p:Path(p).stat().st_size for p in ['cloud.js','wardrobe-data-v34.js','farmer-preview-v33.js','animal-preview-v33.js','lookup-data-v46.js','lookup-extra-v49.js','social-data-v50.js','machine-data-v51.js','switch-names-v47.js','assets/game/local-assets-v67.js']}
          old_names=['cloud.js','wardrobe-data-v34.js','farmer-preview-v33.js','animal-preview-v33.js','lookup-data-v46.js','lookup-extra-v49.js','social-data-v50.js','machine-data-v51.js','switch-names-v47.js']
          eager_names=['cloud.js','farmer-preview-v33.js','animal-preview-v33.js','social-data-v50.js','machine-data-v51.js','switch-names-v47.js','assets/game/local-assets-v67.js']
          old=app+sum(files[x] for x in old_names)
          eager=app+sum(files[x] for x in eager_names)
          lazy=sum(files[x] for x in ['wardrobe-data-v34.js','lookup-data-v46.js','lookup-extra-v49.js'])
          local=Path('assets/game/local-assets-v67.js').read_text().strip()
          m=re.match(r'window\.SDVLocalGameFilesV67=(\{.*\});?$',local,re.S)
          amap=json.loads(m.group(1))
          pngs=list(Path('assets/game').glob('*.png'))
          png_bytes=sum(p.stat().st_size for p in pngs)
          pct=(1-eager/old)*100 if old else 0
          text=f'''# v67 首次載入靜態基準\n\n更新：2026-08-13\n\n這份數字用來比較 v66「所有大型資料在首頁 parser-blocking 載入」與 v67 拆分後的靜態 JS 體積。數字是 repo/build 的未壓縮 bytes，不等同實際行動網路 transfer size；瀏覽器 request waterfall 仍以實機 DevTools 為準。\n\n- Safari 15 minified `app.js`：{app:,} bytes\n- v66 模式首頁 JS（app + 9 個同步資料/runtime 檔）：{old:,} bytes\n- v67 首頁 eager JS（app + 共用 runtime／名稱資料 + local asset map）：{eager:,} bytes\n- 改為按需載入：{lazy:,} bytes（lookup、lookup-extra、wardrobe）\n- 靜態首頁 JS 減少：約 {pct:.1f}%\n- repo 內本地遊戲圖片映射：{len(amap)} 個名稱\n- `assets/game` PNG：{len(pngs)} 個，共 {png_bytes:,} bytes\n\n目前 `switch-names-v47.js` 保持 eager，因為它是全站 Switch canonical display-name 層，不是衣櫥專用資料。lookup 與衣櫥目錄只有進入相關頁面／操作時才載入，不再在總覽閒置數秒後自動 prefetch。\n'''
          Path('docs/PERFORMANCE_BASELINE.md').write_text(text)
          print(text)
          PY
          python3 scripts/audit-foundation-v67.py

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name quiet-axis2024
          git config user.email jinx.lin0820@gmail.com
          git add app.jsx index.html sw.js README.md build-cloudflare.sh .github/workflows/pages.yml \
            lookup-data-v46.js lookup-extra-v49.js switch-names-v47.js wardrobe-data-v34.js social-data-v50.js machine-data-v51.js \
            scripts/audit-foundation-v67.py assets docs
          git commit -m "v67: finish foundation schema snapshots loading and asset cache"
          git rm .github/workflows/v67-run-finalize.yml scripts/finalize-v67.py
          if test -f scripts/apply-v67.py; then git rm scripts/apply-v67.py; fi
          git commit -m "build: remove one-time v67 migration helpers"
          git push origin v67-foundation-polish
