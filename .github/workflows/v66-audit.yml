name: Apply v66 lookup search and icon fixes

on:
  push:
    branches: [v66-lookup-audit-fixes]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v66-lookup-audit-fixes
          fetch-depth: 0

      - name: Apply v66 fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('app.jsx')
          s=p.read_text(encoding='utf-8')

          s=s.replace('<SectionTitle icon="🎒">農場名片</SectionTitle>','<SectionTitle icon="game:Warp Totem Farm">農場名片</SectionTitle>')
          s=s.replace('<SectionTitle icon="🎩">衣櫥搭配</SectionTitle>','<SectionTitle icon="game:Deluxe Cowboy Hat">衣櫥搭配</SectionTitle>')

          old_all='const all=[...index.values()].sort((a,b)=>a.name.localeCompare(b.name,"zh-Hant"));'
          new_all='const all=[...index.values()].filter(it=>{const name=String(it.name||"").trim(),file=String(it.file||"").trim();return Boolean(name)&&!/^\\d+$/.test(name)&&!/^\\d+$/.test(file)&&!/^\\?\\?.+\\?\\?$/.test(name)}).sort((a,b)=>a.name.localeCompare(b.name,"zh-Hant"));'
          if old_all not in s: raise SystemExit('all-items marker missing')
          s=s.replace(old_all,new_all,1)

          start=s.index('    const itemTagKeysV65=it=>')
          end=s.index('    const quickNames=',start)
          replacement='''    const LOOKUP_EQUIPMENT_FILES_V66=new Set([\n      "Bee House","Cask","Cheese Press","Dehydrator","Fish Smoker","Keg","Loom","Mayonnaise Machine","Oil Maker","Preserves Jar",\n      "Sprinkler","Quality Sprinkler","Iridium Sprinkler","Scarecrow","Deluxe Scarecrow","Garden Pot","Auto-Grabber","Auto-Petter","Heater","Coffee Maker","Farm Computer","Hopper","Workbench","Mini-Shipping Bin","Sewing Machine","Telephone","Mini-Fridge","Mini-Jukebox","Statue Of Blessings","Statue Of The Dwarf King",\n      "Bait Maker","Bone Mill","Charcoal Kiln","Crystalarium","Deluxe Worm Bin","Furnace","Geode Crusher","Heavy Furnace","Heavy Tapper","Lightning Rod","Mushroom Log","Ostrich Incubator","Recycling Machine","Seed Maker","Slime Egg-Press","Slime Incubator","Solar Panel","Tapper","Wood Chipper","Worm Bin","Deconstructor","Anvil","Mini-Forge","Crab Pot"\n    ]);\n    const itemIsEquipmentV66=it=>{const values=[it?.file,it?.name,...(it?.aliases||[])].filter(Boolean).map(String);return values.some(v=>LOOKUP_EQUIPMENT_FILES_V66.has(v))};\n    const itemIsCraftableV66=it=>{const recipeSource=[...(it?.sources||[])].some(src=>/^製作：/.test(String(src||"")));const machineMeta=window.SDVMachineV51?.byName?.[String(it?.file||"")]||window.SDVMachineV51?.byName?.[String(it?.name||"")];return recipeSource||Boolean(machineMeta?.ingredients?.length)};\n    const itemTagKeysV65=it=>{const tags=[];if(itemCurrentSeasonV49(it))tags.push("當季");if(["crop","seed","fruit","sapling"].includes(it?.farmingKind))tags.push("耕種");if(it?.farmingKind==="food"||it?.cookNeed||it?.kinds?.has("cooking"))tags.push("料理");if(it?.shippable)tags.push("出貨");if(it?.kinds?.has("artifact")||it?.kinds?.has("mineral"))tags.push("博物館");if(it?.bundles?.length||it?.remix?.length)tags.push("收集包");if(it?.kinds?.has("fish"))tags.push("魚");if(itemIsCraftableV66(it))tags.push("製作");if(itemIsEquipmentV66(it))tags.push("設備");return [...new Set(tags)]};\n    const ITEM_TAG_ALIASES_V65={"當季":["當季","当季","season"],"耕種":["耕種","耕种","農作","农作","farming","crop"],"料理":["料理","烹飪","烹饪","cooking","food"],"出貨":["出貨","出货","shipping"],"博物館":["博物館","博物馆","museum"],"收集包":["收集包","bundle"],"魚":["魚","鱼","fish"],"製作":["製作","制作","craft","crafting"],"設備":["設備","设备","machine"]};\n    const typedTagV65=!itemUsageFilterV65&&q.length>=2?(Object.entries(ITEM_TAG_ALIASES_V65).find(([tag,aliases])=>[tag,...aliases].some(x=>{const normalized=normalizeItemSearchV43(x);return normalized===q||normalized.startsWith(q)}))?.[0]||""):"";\n    const activeTagV65=itemUsageFilterV65||typedTagV65;\n    const nameQueryV65=typedTagV65?"":q;\n    const matchesNameV65=it=>!nameQueryV65||[it.name,it.file,switchNameV47(it.name,it.file),...it.aliases].some(alias=>normalizeItemSearchV43(alias).includes(nameQueryV65));\n    const matchesTagV65=it=>!activeTagV65||itemTagKeysV65(it).includes(activeTagV65);\n'''
          s=s[:start]+replacement+s[end:]

          s=s.replace('輸入物品名稱，查看用途、取得方式與相關收集需求；也可以直接用分類篩選。','輸入物品名稱可模糊搜尋；分類可單獨使用，也能和搜尋文字一起篩選。')

          p.write_text(s,encoding='utf-8')

          p=Path('index.html'); h=p.read_text(encoding='utf-8')
          if '?v=65' not in h: raise SystemExit('index v65 marker missing')
          p.write_text(h.replace('?v=65','?v=66').replace('<!-- deploy-v65 -->','<!-- deploy-v66 -->'),encoding='utf-8')
          p=Path('sw.js'); w=p.read_text(encoding='utf-8')
          if 'stardew-tracker-v65' not in w: raise SystemExit('sw v65 marker missing')
          p.write_text(w.replace('stardew-tracker-v65','stardew-tracker-v66'),encoding='utf-8')
          PY

      - name: Validate v66
        run: |
          set -euo pipefail
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8 eslint@8.57.1
          mkdir -p verify-v66
          cat > verify-v66/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          const ReactDOM = { createRoot };
          window.React = React;
          window.ReactDOM = ReactDOM;
          EOF
          cat app.jsx >> verify-v66/entry.jsx
          ./node_modules/.bin/esbuild verify-v66/entry.jsx --bundle --format=iife --target=safari15 --outfile=verify-v66/app.js
          ./node_modules/.bin/eslint verify-v66/entry.jsx --no-ignore --no-eslintrc --env browser,es2021 --parser-options '{"ecmaVersion":2022,"sourceType":"module","ecmaFeatures":{"jsx":true}}' --rule 'no-undef:error' --rule 'no-unused-vars:off'
          node --check sw.js
          node <<'NODE'
          global.window={}; require('./lookup-data-v46.js'); require('./machine-data-v51.js');
          const rows=window.SDVLookupV46.items||[];
          const numeric=x=>/^\d+$/.test(String(x||'').trim());
          const actualCraft=rows.filter(r=>(r.sources||[]).some(x=>String(x).startsWith('製作：')));
          if(actualCraft.some(r=>numeric(r.name)||numeric(r.file))) throw new Error('numeric row still counted as actual craft');
          const bogus=rows.filter(r=>numeric(r.name)||numeric(r.file));
          console.log('lookup rows',rows.length,'bogus rows safely excluded by v66',bogus.length,'actual craftables',actualCraft.length);
          NODE
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app.jsx').read_text(encoding='utf-8')
          assert '<SectionTitle icon="game:Warp Totem Farm">農場名片</SectionTitle>' in s
          assert '<SectionTitle icon="game:Deluxe Cowboy Hat">衣櫥搭配</SectionTitle>' in s
          assert 'LOOKUP_EQUIPMENT_FILES_V66' in s and 'itemIsCraftableV66' in s and 'itemIsEquipmentV66' in s
          assert 'it?.kinds?.has("craft")' not in s[s.index('const itemTagKeysV65'):s.index('const ITEM_TAG_ALIASES_V65')]
          assert 'it?.kinds?.has("big")' not in s[s.index('const itemTagKeysV65'):s.index('const ITEM_TAG_ALIASES_V65')]
          assert '!itemUsageFilterV65&&q.length>=2' in s
          assert 'normalized.startsWith(q)' in s
          assert 'switchNameV47(it.name,it.file)' in s[s.index('const matchesNameV65'):s.index('const matchesTagV65')]
          # Important user scenario: when a manual category is selected, typed text must remain a name query.
          tag_logic=s[s.index('const typedTagV65'):s.index('const quickNames=')]
          assert 'const nameQueryV65=typedTagV65?"":q' in tag_logic
          assert '!itemUsageFilterV65' in tag_logic
          h=Path('index.html').read_text(encoding='utf-8'); w=Path('sw.js').read_text(encoding='utf-8')
          assert '?v=66' in h and 'stardew-tracker-v66' in w
          print('v66 lookup semantics and UI regression checks passed')
          PY

      - name: Commit v66
        run: |
          set -euo pipefail
          rm -rf verify-v66 node_modules package-lock.json package.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx index.html sw.js
          git rm -f .github/workflows/v66-audit.yml
          git commit -m 'v66: repair lookup filters icons and fuzzy search'
          git push origin HEAD:v66-lookup-audit-fixes
