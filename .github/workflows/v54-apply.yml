name: Apply v54 UI regression fixes
on:
  push:
    branches: [v54-ui-regression-fixes]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v54-ui-regression-fixes
          fetch-depth: 0
      - name: Patch runtime refs, calendar interactions and mobile layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app.jsx')
          s=p.read_text(encoding='utf-8')

          def rep(old,new,label):
              global s
              if old not in s:
                  raise RuntimeError(f'missing patch anchor: {label}')
              s=s.replace(old,new,1)

          helpers='''  const updateNested = (key, patch) => update({ [key]: { ...data[key], ...patch } });

  /* v54: shared runtime helpers. Keep every tab on the same persisted data model. */
  const extrasState = data.extras || {};
  const updateExtras = patch => update({ extras: { ...extrasState, ...patch } });

  const powerBucketV54 = kind => kind === "special" ? "wallet" : kind === "books" ? "abilities" : "mastery";
  const powerValuesV54 = kind => data[powerBucketV54(kind)] || [];
  const powerAliasesV54 = it => [it?.id, it?.name, ...(it?.legacy || [])].filter(Boolean);
  const isPowerChecked = (kind, it) => {
    const values = powerValuesV54(kind);
    return powerAliasesV54(it).some(v => values.includes(v));
  };
  const togglePower = (kind, it) => {
    const key = powerBucketV54(kind);
    const values = powerValuesV54(kind);
    const aliases = powerAliasesV54(it);
    const on = aliases.some(v => values.includes(v));
    const cleaned = values.filter(v => !aliases.includes(v));
    update({ [key]: on ? cleaned : [...cleaned, it.id] });
  };

  const derivedAchievement = id => {
    const income = Number(data.base?.totalIncome || 0);
    const hearts = Object.values(data.friendship || {}).map(v => Number(v) || 0);
    const cooked = (data.cookingCollectionV3 || []).length;
    const fishKinds = (data.collections?.fish || []).length;
    const museumCount = (data.collections?.artifact || []).length + (data.collections?.mineral || []).length;
    const museumTarget = (COLLECTIONS.artifact?.items?.length || 0) + (COLLECTIONS.mineral?.items?.length || 0);
    const shippingCount = (data.shippingV30 || []).length;
    const skills = SKILLS.map(sk => Number(data.skills?.[sk.id] || 0));
    switch(id){
      case "greenhorn": return income >= 15000;
      case "cowpoke": return income >= 50000;
      case "homesteader": return income >= 250000;
      case "millionaire": return income >= 1000000;
      case "legend": return income >= 10000000;
      case "museum_all": return museumTarget > 0 && museumCount >= museumTarget;
      case "treasure40": return museumCount >= 40;
      case "friend5": return hearts.some(v => v >= 5);
      case "friend10": return hearts.some(v => v >= 10);
      case "beloved": return hearts.filter(v => v >= 10).length >= 8;
      case "cliques": return hearts.filter(v => v >= 5).length >= 4;
      case "networking": return hearts.filter(v => v >= 5).length >= 10;
      case "popular": return hearts.filter(v => v >= 5).length >= 20;
      case "cook10": return cooked >= 10;
      case "cook25": return cooked >= 25;
      case "cookall": return COOKING_DISHES_V3.length > 0 && cooked >= COOKING_DISHES_V3.length;
      case "house1": return Number(data.house || 0) >= 1;
      case "house2": return Number(data.house || 0) >= 2;
      case "fish10": return fishKinds >= 10;
      case "fish24": return fishKinds >= 24;
      case "fishall": return COLLECTIONS.fish?.items?.length > 0 && fishKinds >= COLLECTIONS.fish.items.length;
      case "fullshipment": return SHIPPING_ITEMS_V30.length > 0 && shippingCount >= SHIPPING_ITEMS_V30.length;
      case "bottom": return Number(data.mine?.normal || 0) >= 120;
      case "locallegend": return BUNDLE_ROOMS.every(r => (data.bundleDone || []).includes(r.id));
      case "joja": return Boolean(data.jojaMemberV28) && (data.jojaProjectsV28 || []).length >= JOJA_PROJECTS_V28.length;
      case "stardrops": return (data.stardropsV2 || []).length >= STARDROP_SOURCES_V26.length;
      case "talent": return skills.some(v => v >= 10);
      case "five": return skills.every(v => v >= 10);
      case "wellread": return BOOK_POWERS_V2.every(it => isPowerChecked("books", it));
      case "neighbors": return Number(data.raccoonV50?.requests || 0) >= 9;
      default: return false;
    }
  };
  const achievementChecked = id => derivedAchievement(id) || (data.achievementsV2 || []).includes(id);
  const toggleAchievement = id => {
    if(derivedAchievement(id)) return;
    const values = data.achievementsV2 || [];
    update({ achievementsV2: values.includes(id) ? values.filter(v => v !== id) : [...values, id] });
  };

  const lookupRowV54 = raw => {
    const needle = normalizeItemSearchV43(raw);
    if(!needle) return null;
    return (window.SDVLookupV46?.items || []).find(row => [row?.name,row?.zh,row?.file,...(row?.aliases || [])].filter(Boolean).some(v => normalizeItemSearchV43(v) === needle)) || null;
  };
  const openItemLookupV54 = (raw, preferredKey="") => {
    const row = lookupRowV54(raw);
    const key = preferredKey || row?.file || itemFileZhV26(raw) || row?.name || raw;
    setItemUsageQueryV42(row?.name || raw);
    setItemUsageSelectedV42(key);
    setFishViewV4("items");
    setTab("fishing");
    requestAnimationFrame(() => window.scrollTo({top:0,left:0,behavior:"auto"}));
  };
'''
          rep('''  const updateNested = (key, patch) => update({ [key]: { ...data[key], ...patch } });
''',helpers,'shared helpers')

          rep('''  const renderMiniItemV26 = (name, tone=C.cream) => {
    const file=itemFileZhV26(name);
    return <div key={name} style={{width:54,minWidth:54,border:`1px solid ${C.line}`,background:tone,borderRadius:8,padding:"4px 2px",textAlign:"center"}}>{file?<GameIcon file={file} size={26} alt={name}/>:<div style={{height:26,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>•</div>}<div style={{fontSize:7.2,fontWeight:900,color:C.ink,lineHeight:1.05,marginTop:2,overflow:"hidden",textOverflow:"ellipsis"}}>{switchNameV47(name,file)}</div></div>;
  };
''','''  const renderMiniItemV26 = (name, tone=C.cream, fileHint="") => {
    const row=lookupRowV54(name);
    const file=row?.file||fileHint||itemFileZhV26(name)||"";
    const canLookup=Boolean(row);
    return <button type="button" key={`${name}-${file}`} disabled={!canLookup} onClick={()=>openItemLookupV54(name,row?.file||file)} style={{width:"100%",minWidth:0,border:`1px solid ${C.line}`,background:tone,borderRadius:8,padding:"4px 2px",textAlign:"center",font:"inherit",cursor:canLookup?"pointer":"default",opacity:canLookup?1:.78}}>{file?<GameIcon file={file} size={26} alt={name}/>:<div style={{height:26,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>•</div>}<div style={{fontSize:7.2,fontWeight:900,color:C.ink,lineHeight:1.05,marginTop:2,overflow:"hidden",textOverflow:"ellipsis"}}>{switchNameV47(name,file)}</div></button>;
  };
''','calendar mini item')

          rep('''{gift?.love?.length>0&&<div style={{display:"flex",gap:4,overflowX:"auto",marginTop:6,paddingBottom:2}}>{gift.love.slice(0,8).map(x=>renderMiniItemV26(x,"#FFF8E3"))}</div>}''','''{gift?.love?.length>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(4,minmax(0,1fr))",gap:4,marginTop:6}}>{gift.love.slice(0,8).map(x=>renderMiniItemV26(x,"#FFF8E3"))}</div>}''','birthday gift grid')

          oldfest='''{g.items?.length>0&&<div style={{display:"flex",gap:4,overflowX:"auto",marginTop:6,paddingBottom:2}}>{g.items.map(([file,name])=><div key={name} style={{width:58,minWidth:58,border:`1px solid ${C.line}`,background:"#FFF8E3",borderRadius:8,padding:"4px 2px",textAlign:"center"}}><GameIcon file={file} size={27} alt={name}/><div style={{fontSize:7.2,fontWeight:900,color:C.ink,lineHeight:1.05,marginTop:2}}>{name}</div></div>)}</div>}'''
          newfest='''{g.items?.length>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(4,minmax(0,1fr))",gap:4,marginTop:6}}>{g.items.map(([file,name])=>renderMiniItemV26(name,"#FFF8E3",file))}</div>}'''
          rep(oldfest,newfest,'festival item grid')

          rep('''    const openLookupV50=item=>{
      const m=giftMetaV50(item); if(!m.canLookup)return;
      setItemUsageQueryV42(m.raw); setItemUsageSelectedV42(m.key); setFishViewV4("items"); setTab("fishing"); window.scrollTo(0,0);
    };
''','''    const openLookupV50=item=>{
      const m=giftMetaV50(item); if(!m.canLookup)return;
      openItemLookupV54(m.raw,m.key);
    };
''','social shared lookup')

          rep('''style={{display:"grid",gridAutoFlow:"column",gridTemplateRows:"repeat(2,68px)",gridAutoColumns:"82px",gap:4,overflowX:"auto",padding:"5px 0 2px",WebkitOverflowScrolling:"touch"}}''','''style={{display:"grid",width:"100%",maxWidth:"100%",minWidth:0,contain:"inline-size",gridAutoFlow:"column",gridTemplateRows:"repeat(2,68px)",gridAutoColumns:"82px",gap:4,overflowX:"auto",overflowY:"hidden",overscrollBehaviorX:"contain",padding:"5px 0 2px",WebkitOverflowScrolling:"touch"}}''','merchant stock scroller containment')

          rep('''return <Card key={n} style={{padding:7,background:open?"#FFF8E9":C.paper}}>''','''return <Card key={n} style={{padding:7,background:open?"#FFF8E9":C.paper,minWidth:0,maxWidth:"100%",overflow:"hidden"}}>''','social card containment')

          rep('''<main style={{maxWidth:680,margin:"0 auto",padding:"8px 12px 24px"}}>{content()}</main>''','''<main style={{width:"100%",maxWidth:680,minWidth:0,margin:"0 auto",padding:"8px 12px 24px",overflowX:"hidden"}}>{content()}</main>''','main width containment')

          p.write_text(s,encoding='utf-8')

          ip=Path('index.html'); h=ip.read_text(encoding='utf-8')
          h=h.replace('''    html,body,#root{margin:0;min-height:100%;width:100%;max-width:100%;overflow-x:hidden;background:#5a3825}
    *{box-sizing:border-box}
    body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
    button,input,textarea,select{font:inherit;max-width:100%}
''','''    html,body,#root{margin:0;min-height:100%;width:100%;max-width:100%;overflow-x:hidden;background:#5a3825}
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
    *{box-sizing:border-box}
    body{position:relative;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
    button,input,textarea,select{font:inherit;max-width:100%}
    @media (hover:none) and (pointer:coarse){input,textarea,select{font-size:16px!important}}
''')
          if '?v=53' not in h: raise RuntimeError('v53 asset marker missing')
          h=h.replace('?v=53','?v=54').replace('<!-- deploy-v53 -->','<!-- deploy-v54 -->')
          ip.write_text(h,encoding='utf-8')

          sw=Path('sw.js'); w=sw.read_text(encoding='utf-8')
          if "stardew-tracker-v53" not in w: raise RuntimeError('v53 cache marker missing')
          sw.write_text(w.replace('stardew-tracker-v53','stardew-tracker-v54',1),encoding='utf-8')
          PY

      - name: Validate every page for undefined runtime references
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save eslint@8 react@18 react-dom@18 esbuild@0.25.8 >/dev/null 2>&1
          ./node_modules/.bin/eslint app.jsx \
            --no-eslintrc \
            --env browser,es2021 \
            --parser-options '{"ecmaVersion":2022,"sourceType":"script","ecmaFeatures":{"jsx":true}}' \
            --global React \
            --global ReactDOM \
            --rule 'no-undef:error'
          grep -q 'const isPowerChecked' app.jsx
          grep -q 'const achievementChecked' app.jsx
          grep -q 'const extrasState' app.jsx
          grep -q 'font-size:16px!important' index.html
          grep -q 'stardew-tracker-v54' sw.js

      - name: Build Safari bundle and smoke-check v54 artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build /tmp/v54dist
          cat > build/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React = React;
          window.ReactDOM = { createRoot };
          EOF
          cat app.jsx >> build/entry.jsx
          ./node_modules/.bin/esbuild build/entry.jsx --bundle --minify --format=iife --target=safari15 --outfile=/tmp/v54dist/app.js
          cp index.html manifest.webmanifest icon.svg sw.js cloud.js wardrobe-data-v34.js farmer-preview-v33.js animal-preview-v33.js lookup-data-v46.js lookup-extra-v49.js social-data-v50.js machine-data-v51.js switch-names-v47.js /tmp/v54dist/
          test -s /tmp/v54dist/app.js
          grep -q 'app.js?v=54' /tmp/v54dist/index.html
          grep -q 'lookup-data-v46.js?v=54' /tmp/v54dist/index.html

      - name: Commit product fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx index.html sw.js
          git commit -m 'v54: fix calendar, runtime handlers and iPhone layout'
          git push origin HEAD:v54-ui-regression-fixes
