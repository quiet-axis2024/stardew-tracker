name: Apply v54 UI fixes
on:
  push:
    branches: [v54-ui-regression-fixes]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v54-ui-regression-fixes
          fetch-depth: 0
      - name: Apply v54 patch
        run: python3 .github/scripts/v54_patch.py
      - name: Keep lookup normalizer in shared scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.jsx')
          s=p.read_text(encoding='utf-8')
          old='''  const lookupRowV54 = raw => {
    const needle = normalizeItemSearchV43(raw);
    if(!needle) return null;
    return (window.SDVLookupV46?.items || []).find(row => [row?.name,row?.zh,row?.file,...(row?.aliases || [])].filter(Boolean).some(v => normalizeItemSearchV43(v) === needle)) || null;
  };
'''
          new='''  const normalizeLookupV54 = value => String(value||"").normalize("NFKC").toLowerCase().replace(/[\\s·・_\u0027’\\-]+/g,"");
  const lookupRowV54 = raw => {
    const needle = normalizeLookupV54(raw);
    if(!needle) return null;
    return (window.SDVLookupV46?.items || []).find(row => [row?.name,row?.zh,row?.file,switchNameV47(row?.name,row?.file),...(row?.aliases || [])].filter(Boolean).some(v => normalizeLookupV54(v) === needle)) || null;
  };
'''
          if old not in s: raise RuntimeError('v54 lookup helper anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Install validation tools
        run: npm install --no-save eslint@8 react@18 react-dom@18 esbuild@0.25.8 >/dev/null 2>&1
      - name: Audit undefined runtime references
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/eslint app.jsx \
            --no-eslintrc \
            --env browser,es2021 \
            --parser-options '{"ecmaVersion":2022,"sourceType":"script","ecmaFeatures":{"jsx":true}}' \
            --global React \
            --global ReactDOM \
            --rule 'no-undef:error'
          grep -q 'const isPowerChecked' app.jsx
          grep -q 'const achievementChecked' app.jsx
          grep -q 'const extrasState' app.jsx
          grep -q 'font-size:16px!important' index.html
          grep -q 'stardew-tracker-v54' sw.js
      - name: Build Safari bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build /tmp/v54dist
          printf '%s\n' \
            "import React from 'react';" \
            "import { createRoot } from 'react-dom/client';" \
            "window.React = React;" \
            "window.ReactDOM = { createRoot };" > build/entry.jsx
          cat app.jsx >> build/entry.jsx
          ./node_modules/.bin/esbuild build/entry.jsx --bundle --minify --format=iife --target=safari15 --outfile=/tmp/v54dist/app.js
          test -s /tmp/v54dist/app.js
          grep -q 'app.js?v=54' index.html
          grep -q 'lookup-data-v46.js?v=54' index.html
      - name: Commit product fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx index.html sw.js
          git commit -m 'v54: fix calendar, runtime handlers and iPhone layout'
          git push origin HEAD:v54-ui-regression-fixes
