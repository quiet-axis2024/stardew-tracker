name: Apply and validate v54 fixes
on:
  push:
    branches: [v54-ui-regression-fixes]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v54-ui-regression-fixes
          fetch-depth: 0
      - name: Apply product patches
        run: |
          python3 .github/scripts/v54_patch.py
          python3 .github/scripts/v54_post_patch.py
      - name: Install validation tools
        run: npm install --no-save eslint@8 react@18 react-dom@18 esbuild@0.25.8 >/dev/null 2>&1
      - name: Audit all app runtime references
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/eslint app.jsx \
            --no-eslintrc \
            --env browser,es2021 \
            --parser-options '{"ecmaVersion":2022,"sourceType":"script","ecmaFeatures":{"jsx":true}}' \
            --global React:readonly \
            --global ReactDOM:readonly \
            --rule 'no-undef:error'
          grep -q 'const isPowerChecked' app.jsx
          grep -q 'const toggleAchievement' app.jsx
          grep -q 'const extrasState' app.jsx
          grep -q 'font-size:16px!important' index.html
          grep -q 'stardew-tracker-v54' sw.js
      - name: Build Safari 15 bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build /tmp/v54dist
          printf '%s\n' "import React from 'react';" "import { createRoot } from 'react-dom/client';" "window.React = React;" "window.ReactDOM = { createRoot };" > build/entry.jsx
          cat app.jsx >> build/entry.jsx
          ./node_modules/.bin/esbuild build/entry.jsx --bundle --minify --format=iife --target=safari15 --outfile=/tmp/v54dist/app.js
          test -s /tmp/v54dist/app.js
          grep -q 'app.js?v=54' index.html
          grep -q 'lookup-data-v46.js?v=54' index.html
      - name: Commit product fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx index.html sw.js
          git commit -m 'v54: fix calendar, runtime handlers and iPhone layout'
          git push origin HEAD:v54-ui-regression-fixes
