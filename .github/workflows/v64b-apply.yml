name: Apply v64b dex regression fix

on:
  push:
    branches: [v64-lookup-ui-fixes]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v64-lookup-ui-fixes
          fetch-depth: 0

      - name: Restore dex renderer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('app.jsx')
          s=p.read_text(encoding='utf-8')
          if 'const renderDexCollection = () => {' not in s:
              old=subprocess.check_output(['git','show','f6cc932c0041fc70a36c85d68512b13399d97e57:app.jsx'], text=True)
              a=old.index('  const renderDexCollection = () => {')
              b=old.index('  const prepSetV3', a)
              block=old[a:b]
              marker='  const prepSetV3'
              if s.count(marker)!=1:
                  raise SystemExit('prepSetV3 marker mismatch')
              s=s.replace(marker,block+marker,1)
          if s.count('const renderDexCollection = () => {')!=1:
              raise SystemExit('renderDexCollection restore failed')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate all collection and lookup renderers
        run: |
          set -euo pipefail
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8
          mkdir -p .verify
          cat > .verify/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React = React;
          window.ReactDOM = { createRoot };
          EOF
          cat app.jsx >> .verify/entry.jsx
          ./node_modules/.bin/esbuild .verify/entry.jsx --bundle --format=iife --target=safari15 --outfile=.verify/app.js
          node --check sw.js
          for fn in renderItemUsageV42 renderDexCollection renderFishDexV4 renderCookingV3 renderAchievements renderShippingV30 renderCollection renderFishingV30; do
            test "$(grep -c "const $fn = () => {" app.jsx)" -eq 1 || { echo "missing/duplicate $fn"; exit 1; }
          done
          grep -q 'collectionSection==="artifact"&&renderDexCollection()' app.jsx
          grep -q 'collectionSection==="mineral"&&renderDexCollection()' app.jsx
          grep -q 'fast==="items"?renderItemUsageV42():renderFishFindV4()' app.jsx
          grep -q 'SimpleItemInfoV62 name={selectedRow\[1\]}' app.jsx
          grep -q 'selectedAchievementV64' app.jsx
          grep -q '?v=64' index.html
          grep -q 'stardew-tracker-v64' sw.js

      - name: Commit v64b
        run: |
          set -euo pipefail
          rm -rf .verify node_modules package-lock.json package.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx
          git rm -f .github/workflows/v64b-apply.yml
          git commit -m 'v64: restore artifact and mineral renderer'
          git push origin HEAD:v64-lookup-ui-fixes
