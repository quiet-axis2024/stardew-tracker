name: Apply v50 farm and social changes

on:
  push:
    branches: [v50-farm-social]
    paths:
      - 'v50_patch.py'
      - '.github/workflows/v50-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v50-farm-social
          fetch-depth: 0

      - name: Apply v50 patch
        run: python3 v50_patch.py

      - name: Build browser bundle
        run: npx --yes esbuild@0.25.0 app.jsx --bundle --format=iife --outfile=/tmp/app-v50.js --loader:.jsx=jsx

      - name: Validate generated JavaScript
        run: |
          node --check social-data-v50.js
          node --check sw.js

      - name: Validate requested changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('app.jsx').read_text()
          idx=Path('index.html').read_text()
          sw=Path('sw.js').read_text()
          social=Path('social-data-v50.js').read_text()
          assert 'grayscale(1)' in app and 'active?1:.32' in app
          assert 'name="連線小屋" file="Trailer Cabin"' in app
          assert 'gridTemplateColumns:"repeat(6,minmax(0,1fr))"' in app
          assert '農務設備' in app and 'Auto-Petter' in app and 'Iridium Sprinkler' in app
          assert '大樹樁・浣熊一家' in app and '好鄰居成就' in app
          assert 'window.SDVSocialV50' in social and '特殊訂單看板' in app
          assert '完整個人偏好' in app and 'openLookupV50' in app
          assert 'ShopV50' in app and '目前 {data.base.season}季可見庫存' in app
          assert 'social-data-v50.js?v=50' in idx and "app.js?v=50" in idx
          assert "stardew-tracker-v50" in sw and 'social-data-v50.js' in sw
          print('v50 validation passed')
          PY

      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx index.html sw.js social-data-v50.js
          git rm -f v50_patch.py .github/workflows/v50-apply.yml
          git commit -m 'v50: compact farm tools and richer social reference'
          git push origin v50-farm-social
