name: Probe v33 real Stardew sprite assets

on:
  push:
    branches: [v33-real-game-sprites]

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v33-real-game-sprites
          fetch-depth: 0
      - name: Probe sprite sources
        shell: bash
        run: |
          set -uo pipefail
          : > sprite-probe.txt
          for host in stardewvalleywiki.com wiki.stardewvalley.net; do
            for f in farmer_base farmer_girl_base farmer_base_bald farmer_girl_base_bald hairstyles hairstyles2 hats pants shirts shoeColors skinColors; do
              url="https://${host}/Special:Redirect/file/${f}.png"
              code=$(curl -L -sS -o "/tmp/${f}-${host//./_}.png" -w '%{http_code}' "$url" || true)
              typ=$(file -b "/tmp/${f}-${host//./_}.png" 2>/dev/null || true)
              size=$(stat -c '%s' "/tmp/${f}-${host//./_}.png" 2>/dev/null || echo 0)
              printf '%s | %s | %s | %s\n' "$url" "$code" "$size" "$typ" >> sprite-probe.txt
            done
          done
          cat sprite-probe.txt
      - name: Commit probe result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sprite-probe.txt
          git commit -m 'Probe real Stardew sprite asset URLs' || exit 0
          git push origin HEAD:v33-real-game-sprites
