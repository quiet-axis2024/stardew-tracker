name: Apply v32 wardrobe preview

on:
  push:
    branches: [v32-wardrobe-preview]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v32-wardrobe-preview
          fetch-depth: 0

      - name: Apply v32 patch
        run: |
          set -euo pipefail
          python3 v32_patch.py

      - name: Compile and validate
        run: |
          set -euo pipefail
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8
          mkdir -p .verify
          cat > .verify/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React = React;
          window.ReactDOM = { createRoot };
          EOF
          cat app.jsx >> .verify/entry.jsx
          ./node_modules/.bin/esbuild .verify/entry.jsx --bundle --format=iife --target=safari15 --outfile=.verify/app.js
          grep -q 'wardrobeDirectionV32' app.jsx
          grep -q '四方向換裝預覽' app.jsx
          grep -q 'type="color"' app.jsx
          grep -q 'app.js?v=32' index.html
          grep -q 'cloud.js?v=32' index.html
          grep -q 'stardew-tracker-v32' sw.js

      - name: Commit v32 branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx index.html sw.js
          git rm v32_patch.py .github/workflows/v32-apply.yml
          git commit -m 'Add v32 four-direction wardrobe preview'
          git push origin HEAD:v32-wardrobe-preview
