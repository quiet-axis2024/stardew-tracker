name: Validate v83 World

on:
  push:
    branches: [v83-world-linked-navigation]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run full Cloudflare build validation
        shell: bash
        run: bash build-cloudflare.sh
