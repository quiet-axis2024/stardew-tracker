name: Runtime Smoke Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair canonical app.jsx
        run: python3 runtime_repair.py

      - name: Build and execute all major pages in DOM
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save react@18 react-dom@18 esbuild@0.25.8 jsdom@26
          mkdir -p .smoke
          cat > .smoke/entry.jsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          window.React = React;
          window.ReactDOM = { createRoot };
          EOF
          cat app.jsx >> .smoke/entry.jsx
          ./node_modules/.bin/esbuild .smoke/entry.jsx --bundle --format=iife --target=safari15 --outfile=.smoke/app.js
          cat > smoke.mjs <<'EOF'
          import fs from 'node:fs';
          import { JSDOM, VirtualConsole } from 'jsdom';
          const errors=[]; const vc=new VirtualConsole();
          vc.on('jsdomError',e=>errors.push(String(e?.stack||e))); vc.on('error',e=>errors.push(String(e)));
          const dom=new JSDOM('<!doctype html><html><body><div id="root">boot</div></body></html>',{runScripts:'dangerously',url:'https://quiet-axis2024.github.io/stardew-tracker/',virtualConsole:vc,pretendToBeVisual:true});
          dom.window.alert=()=>{};dom.window.confirm=()=>false;dom.window.prompt=()=>null;dom.window.scrollTo=()=>{};
          dom.window.addEventListener('error',e=>errors.push(`window.error: ${e.message}\n${e.error?.stack||''}`));
          dom.window.eval(fs.readFileSync('.smoke/app.js','utf8'));
          const wait=ms=>new Promise(r=>setTimeout(r,ms)); await wait(600);
          const root=dom.window.document.getElementById('root');
          if(!root.textContent.includes('星露谷進度手帳'))throw new Error('main tracker did not render');
          const clickExact=async text=>{const b=[...root.querySelectorAll('button')].find(x=>x.textContent.trim()===text);if(!b)throw new Error(`button not found: ${text}`);b.dispatchEvent(new dom.window.MouseEvent('click',{bubbles:true}));await wait(100);if(!root.textContent.trim())throw new Error(`blank after ${text}`);};
          for(const tab of ['農場','社交','能力','收藏','備註'])await clickExact(tab);
          await clickExact('收藏');
          for(const sub of ['成就','出貨','信件','秘密紙條','日誌殘頁','烹飪','魚類'])await clickExact(sub);
          if(errors.length){console.error('RUNTIME_ERRORS\n'+errors.join('\n---\n'));process.exit(1)}
          console.log('SMOKE_OK all major pages');
          EOF
          node smoke.mjs

      - name: Commit repaired app.jsx
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx
          git commit -m 'Fix runtime pages lost during source flattening'
          git push origin HEAD:main

      - name: Deploy repaired tracker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
