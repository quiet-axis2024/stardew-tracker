name: Apply v48 hand帳 fixes

on:
  push:
    branches: [v48-clean-ocr-ui-map]
    paths:
      - 'v48_patch.py'
      - '.github/workflows/v48-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v48-clean-ocr-ui-map
          fetch-depth: 0
      - name: Make patch tolerant to compact JSX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v48_patch.py')
          out=[]
          for line in p.read_text().splitlines():
            if 'remove letters collection tab' in line:
              line='s=re.sub(r\'\\s*\\["letters","信件","Mail"\\],?\', \'\', s, count=1)'
            elif 'remove letters panel' in line:
              line='s=re.sub(r\'\\n\\s*\\{collectionSection==="letters"&&<Card[^\\n]*\', \'\', s, count=1)'
            elif 'remove paper wiki link' in line:
              line='s=re.sub(r\'<a href=\\{isNotes\\?"https://stardewvalleywiki\\.com/Secret_Notes":"https://stardewvalleywiki\\.com/Journal_Scraps"\\} target="_blank" rel="noopener noreferrer" style=\\{\\{.*?\\}\\}>Wiki 完整頁面 ↗</a>\', \'\', s, count=1)'
            out.append(line)
          text='\n'.join(out)+'\n'
          text=text.replace('loading="lazy"\\n    onError=', 'loading="lazy" onError=')
          p.write_text(text)
          PY
      - name: Apply v48 patch
        run: |
          rm -f v48_patch.log
          if ! python3 v48_patch.py > v48_patch.log 2>&1; then
            cat v48_patch.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f v48_patch.log
            git commit -m 'chore: record v48 patch failure'
            git push origin v48-clean-ocr-ui-map
            exit 1
          fi
          cat v48_patch.log
      - name: Build browser bundle
        run: npx --yes esbuild@0.25.0 app.jsx --bundle --format=iife --outfile=/tmp/app-v48.js --loader:.jsx=jsx
      - name: Validate requested changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app.jsx').read_text()
          checks={
            'blank seed':'base: { year: 1, season: "春", day: 1, money: 0, totalIncome: 0',
            'skull overview':'["骷髏洞",`${Number(data.mine.skullBest)}層`]',
            'hud money crop':'const hudMoneyCrop = makeCrop(img, 0.890, 0.198',
            'separate day crop':'const dayCrop = makeCrop(img, 0.615, 0.768',
            'walnut milestone':'齊先生的核桃房',
            'image retry':'retryWikiImageV48',
            'map transform':'translate(-${thumb.x}%,-${thumb.y}%)',
          }
          for k,v in checks.items(): assert v in s, k
          assert '["letters","信件","Mail"]' not in s
          assert 'stardewvalleywiki.com/Secret_Notes' not in s
          assert 'stardewvalleywiki.com/Journal_Scraps' not in s
          assert '837908' not in s
          assert '四角農場' not in s
          print('validation passed')
          PY
          grep -q "stardew-tracker-v48" sw.js
      - name: Commit product files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.jsx index.html sw.js
          git rm -f v48_patch.py .github/workflows/v48-apply.yml v48_patch.log 2>/dev/null || true
          git commit -m 'v48: clean state, profile OCR, compact data UI and fish maps'
          git push origin v48-clean-ocr-ui-map