name: Temporary UI icon patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-ui-icon-patch.yml"

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch app.jsx
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("app.jsx")
          s = p.read_text(encoding="utf-8")

          replacements = [
              (
                  'if(tomorrow){const g=FESTIVAL_GUIDE_V26[tomorrow.key];add({id:`tomorrow-festival:${tomorrow.key}`,kind:"festival",guide:g,priority:1,file:"Calendar",reason:"明天",title:`明天是 ${tomorrow.text}`,body:g?.items?.length?"今天可以先確認節日需要的物品或安排。":"明天有節日，今天可先留意行程安排。",action:"前往日曆",run:openCalendarV69});}',
                  'if(tomorrow){const g=FESTIVAL_GUIDE_V26[tomorrow.key];const festivalFile=g?.items?.[0]?.[0]||({"花舞節":"Bouquet","月光水母起舞":"Sea Jelly","冬日星盛宴":"Stardrop"}[tomorrow.key]||SEASON_FILE_V97[data.base.season]);add({id:`tomorrow-festival:${tomorrow.key}`,kind:"festival",guide:g,priority:1,file:festivalFile,reason:"明天",title:`明天是 ${tomorrow.text}`,body:g?.items?.length?"今天可以先確認節日需要的物品或安排。":"明天有節日，今天可先留意行程安排。",action:"前往日曆",run:openCalendarV69});}'
              ),
              (
                  'add({id:"crops-deadline",kind:"crops",inline:true,priority:1,file:"Parsnip",reason:"今天限定",title:`還來得及種（${season}${day}）`,list:list.slice(0,10).map(x=>({en:x.en,zh:x.zh,last:x.plan.lastPlant})),more:Math.max(0,list.length-10)});',
                  'add({id:"crops-deadline",kind:"crops",inline:true,priority:1,file:list[0].en,reason:"今天限定",title:`還來得及種（${season}${day}）`,list:list.slice(0,10).map(x=>({en:x.en,zh:x.zh,last:x.plan.lastPlant})),more:Math.max(0,list.length-10)});'
              ),
              (
                  'add({id:`fish-weather:${weather}`,kind:"fish",rows,weather,priority:1,file:"Sonar Bobber",reason:todayWeatherV69?`今日${weather}天`:`天氣未記錄 · 如果${weather}天`,title:`${icon} ${weather}天可補 ${rows.length} 種未收集魚`,body:`例：${todayFishNamesV69(rows)}。點開可直接看完整清單、地點與時段。`,action:"前往找魚篩選",run:()=>openFishHintV69(weather,rows[0].areaId)});',
                  'add({id:`fish-weather:${weather}`,kind:"fish",rows,weather,priority:1,file:WEATHER_FILE_V97[weather],reason:todayWeatherV69?`今日${weather}天`:`天氣未記錄 · 如果${weather}天`,title:`${icon} ${weather}天可補 ${rows.length} 種未收集魚`,body:`例：${todayFishNamesV69(rows)}。點開可直接看完整清單、地點與時段。`,action:"前往找魚篩選",run:()=>openFishHintV69(weather,rows[0].areaId)});'
              ),
              (
                  'if(rows.length)add({id:`season-fish:${current}`,kind:"fish",rows,weather:"",priority:2,file:"Calendar",reason:"本季快結束",title:`本季剩 ${29-Number(data.base.day||1)} 天，還有 ${rows.length} 種魚快換季`,body:`尚未收集：${todayFishNamesV69(rows)}。點開可直接看完整清單。`,action:"前往當季找魚",run:()=>openFishHintV69("",rows[0].areaId)});',
                  'if(rows.length)add({id:`season-fish:${current}`,kind:"fish",rows,weather:"",priority:2,file:rows[0].file,reason:"本季快結束",title:`本季剩 ${29-Number(data.base.day||1)} 天，還有 ${rows.length} 種魚快換季`,body:`尚未收集：${todayFishNamesV69(rows)}。點開可直接看完整清單。`,action:"前往當季找魚",run:()=>openFishHintV69("",rows[0].areaId)});'
              ),
              (
                  '<GameIcon file={WEATHER_FILE_V97[v]} size={26}/>',
                  '<GameIcon file={WEATHER_FILE_V97[v]} size={23}/>'
              ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, got {count}: {old[:120]}")
              s = s.replace(old, new, 1)

          checks = [
              'file:festivalFile',
              'file:list[0].en',
              'file:WEATHER_FILE_V97[weather]',
              'file:rows[0].file',
              '<GameIcon file={WEATHER_FILE_V97[v]} size={23}/>',
              '<GameIcon file={SEASON_FILE_V97[season]} size={26}/>',
          ]
          missing = [x for x in checks if x not in s]
          if missing:
              raise SystemExit(f"Post-patch verification failed: {missing}")

          p.write_text(s, encoding="utf-8")
          print("Patch verification passed")
          PY

      - name: Commit patched app.jsx
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.jsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Refine weather and Today hint icons"
          git push origin HEAD:main
